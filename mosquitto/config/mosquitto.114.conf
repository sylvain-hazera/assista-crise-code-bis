# Broker MQTT de .114 (conteneur ac_mqtt, docker-compose.114.yml).
#
# Différences avec mosquitto.conf (dev/exemple), toutes volontaires :
#
#   1. AUTHENTIFICATION OBLIGATOIRE et liste de droits. L'ancienne configuration de production
#      était `allow_anonymous true` sans aucun acl_file : n'importe qui pouvant joindre le port
#      pouvait lire et publier (dette inscrite au § 10.2 de DOCUMENTATION.md, levée ici).
#
#   2. UN SEUL listener, en clair, et surtout publié par Compose sur la seule IP du LAN
#      (172.16.1.114), JAMAIS sur 0.0.0.0 -- Docker contourne UFW, un port publié sur 0.0.0.0
#      serait joignable depuis Internet malgré le pare-feu (§ 10.2). Pas de listener 8883, pas
#      de redirection sur la box : seuls les nœuds radio du même réseau local y accèdent.
#      Exposer le broker à Internet demanderait TLS, un certificat, et une décision explicite.
#
#   3. Les comptes sont ADMINISTRÉS DEPUIS L'APPLICATION WEB (/admin/comptes-mqtt). Django est la
#      source de vérité et réécrit ces deux fichiers à chaque changement (core/mqtt_comptes.py) ;
#      une boucle de surveillance dans ce conteneur déclenche alors un rechargement de
#      configuration, et Mosquitto les relit. Au tout premier démarrage, avant que Django n'ait
#      rien écrit, le conteneur s'amorce lui-même depuis ses secrets : le broker ne dépend donc
#      JAMAIS de l'application pour être utilisable. Aucun mot de passe en clair n'est stocké --
#      ces fichiers ne contiennent que des empreintes PBKDF2-SHA512.
#
#      (Le greffon « dynamic security » de Mosquitto, présent dans l'image, a été écarté : il ne
#      sait créer un compte que par un broker en fonctionnement, ce qui rendrait le broker
#      inutilisable tant que Django ne l'a pas amorcé -- vérifié le 06/11/2026.)

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Pas de `per_listener_settings` : déprécié en 2.1 (retiré en 3.0), et `false` est de toute façon
# le défaut -- les réglages d'authentification ci-dessous valent donc pour le listener unique.
allow_anonymous false
# Volume partagé avec le backend. Les deux fichiers sont engendrés : ne pas les modifier à la
# main, la prochaine écriture de Django écraserait la modification.
password_file /mosquitto/comptes/passwd
acl_file /mosquitto/comptes/acl

# Un paquet Meshtastic fait moins de 512 octets : au-delà de 16 Ko, le message est anormal.
max_packet_size 16384
# Pas de file d'attente pour un client déconnecté : une passerelle radio qui revient ne doit pas
# recevoir une rafale de retard, qu'elle réémettrait sur la radio.
max_queued_messages 200

listener 1883
protocol mqtt
