# Production RÉELLE (.114, assista-crise.fr) -- source de vérité du déploiement depuis le 19/10/2026.
# Remplace les `docker run` lancés à la main (aucun conteneur n'était géré par compose, chacun
# avec ses propres options, sans rotation de logs, celery-worker sans redémarrage automatique).
#
#   Déployer un service      : scripts/114/deployer.sh backend frontend ...
#   Tout (re)démarrer        : docker compose -f docker-compose.114.yml up -d
#   Migration initiale       : scripts/114/migrer-vers-compose.sh (une seule fois)
#
# Indépendant de docker-compose.yml/.prod.yml (reconstruction from scratch, registre distant) :
# ici tout tourne déjà, avec des réseaux, volumes et secrets existants (déclarés `external`, jamais
# recréés). Conventions alignées sur les images Docker Hub (stefy237/assista-crise-<service>) :
#   - conteneurs : ac_<service> ;
#   - images construites localement : assista-crise-<service>:prod = ce qui tourne en production ;
#   - le NOM DE SERVICE reste l'ancien nom de conteneur (backend, synapse, mas, redis...) : c'est
#     lui que les autres services utilisent comme nom d'hôte (homeserver.yaml, config MAS,
#     proxy/nginx.conf, CELERY_BROKER_URL...) -- le renommer casserait ces liens.
# Secrets : ~/.config/assista-crise/secrets/ (hors dépôt, sauvegardés par backup-config-secrets.sh).
# Les env_file sont en `format: raw` : certaines valeurs du WAF contiennent `$` (variables nginx),
# qu'une interpolation compose viderait.

name: assista-crise

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-service: &service
  restart: unless-stopped
  <<: *logging

# Pile de supervision : `always` et non `unless-stopped`. La nuance n'est pas cosmétique --
# `unless-stopped` ne relance JAMAIS un conteneur arrêté à la main, même après un redémarrage de
# la machine. ac_prometheus a ainsi été stoppé le 03/11 à 14:16, 1 min 37 avant le reboot de mise
# à jour du noyau : tout le reste est remonté, lui est resté à terre jusqu'au 05/11 (2 j 8 h de
# métriques perdues). Une panne de supervision ne se voit pas -- c'est justement le service qui
# devrait prévenir qui manque -- donc elle ne doit pas pouvoir dépendre d'un geste manuel oublié.
x-service-supervision: &service-supervision
  restart: always
  <<: *logging

services:
  # ------------------------------------------------------------------ point d'entrée public
  waf:
    <<: *service
    image: owasp/modsecurity-crs:nginx
    container_name: ac_waf
    # Lecture de /etc/letsencrypt/live (root:root 0700) par le master nginx -- les workers
    # redescendent en uid nginx (voir proxy/README.md, incident du 15/10).
    user: root
    env_file:
      - { path: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/waf.env", format: raw }
    ports: ["80:8080", "443:8443"]
    volumes:
      - ./proxy/waf-fix-log-symlinks.sh:/docker-entrypoint.d/99-fix-log-symlinks.sh
      - /etc/letsencrypt:/etc/letsencrypt
      - ./proxy/modsecurity-override.conf:/etc/nginx/templates/modsecurity.d/modsecurity-override.conf.template:ro
      # Marque blanche : validation ACME des domaines partenaires (voir proxy/README.md).
      - ./proxy/waf-partenaires-acme.conf:/etc/nginx/templates/conf.d/partenaires-acme.conf.template:ro
      - certbot_webroot:/var/www/certbot
      # Certificat partenaire émis le 22/10/2026 (expire le 2027-01-20). Ce fichier référence
      # /etc/letsencrypt/live/reserve-resilience.org/ : ne jamais le laisser monté si ce
      # certificat venait à disparaître, nginx refuserait de démarrer et tout le site tomberait.
      - ./proxy/waf-partenaires-tls.conf:/etc/nginx/templates/conf.d/partenaires-tls.conf.template:ro
      - waf_modsec_logs:/var/log/modsecurity
      - waf_nginx_logs:/var/log/nginx-real
    networks: [front]
    depends_on: [proxy]

  proxy:
    <<: *service
    image: assista-crise-proxy:prod
    build: ./proxy
    container_name: ac_proxy
    volumes:
      - proxy_nginx_logs:/var/log/nginx-real
      # Fichiers publics servis en direct par nginx (voir location = /prefecture dans
      # proxy/nginx.conf) : montés, pas copiés dans l'image, pour pouvoir remplacer un document
      # sans reconstruire ni redéployer le proxy.
      - ./proxy/public:/var/www/public:ro
    networks: [front, back, grafana-proxy]
    depends_on: [backend, frontend]

  fail2ban:
    <<: *service
    image: crazymax/fail2ban:latest
    container_name: ac_fail2ban
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    env_file:
      - { path: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/fail2ban.env", format: raw }
    # Journal dans un fichier (et non plus `docker logs`) : Alloy le transmet à Loki (page admin
    # Fail2ban). Consultation directe : docker exec ac_fail2ban tail -f /var/log/fail2ban/fail2ban.log
    environment:
      - F2B_LOG_TARGET=/var/log/fail2ban/fail2ban.log
    volumes:
      - fail2ban_data:/data
      - fail2ban_logs:/var/log/fail2ban
      - /home/sylvain/.config/assista-crise/fail2ban/jail.d:/data/jail.d
      - /home/sylvain/.config/assista-crise/fail2ban/action.d:/data/action.d
      - /home/sylvain/.config/assista-crise/fail2ban/filter.d:/data/filter.d
      - ssh_journal_logs:/var/log/ssh-journal
      - waf_nginx_logs:/var/log/waf
      - waf_modsec_logs:/var/log/waf-modsec

  ssh-log-shipper:
    <<: *service
    image: assista-crise-ssh-log-shipper:prod
    container_name: ac_ssh_log_shipper
    network_mode: bridge
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - /var/log/journal:/var/log/journal:ro
      - ssh_journal_logs:/logs

  # ------------------------------------------------------------------ application
  frontend:
    <<: *service
    image: assista-crise-frontend:prod
    build: { context: ./frontend, dockerfile: Dockerfile.prod }
    container_name: ac_frontend
    networks: [front]

  backend:
    <<: *service
    image: assista-crise-backend:prod
    build: ./backend
    container_name: ac_backend
    env_file:
      - { path: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/backend.env", format: raw }
    environment:
      # Dossier où Django écrit les comptes du broker MQTT (core/mqtt_comptes.py). Pas un secret,
      # donc déclaré ici plutôt que dans backend.env (hors dépôt).
      - MQTT_COMPTES_DIR=/var/lib/assista/mqtt
    # Les mêmes secrets que le broker : `manage.py initialiser_comptes_mqtt` enregistre en base
    # les comptes d'amorçage (exporter, pont, passerelle1). Sans eux, la première création de
    # compte depuis le web réécrirait les fichiers SANS ces comptes, coupant l'exporteur et le
    # pont -- un garde-fou dans core/mqtt_comptes.py refuse d'écrire tant qu'ils manquent.
    secrets: [mqtt_exporter_password, mqtt_pont_password, mqtt_passerelle1_password]
    volumes:
      - media_volume:/app/media
      - matrix_bridge_data:/data          # jeton du bot Matrix, partagé avec matrix-bridge
      - mqtt_comptes:/var/lib/assista/mqtt   # lu par ac_mqtt (voir le service mosquitto)
    networks: [back, db, front]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  celery-worker:
    <<: *service
    image: assista-crise-backend:prod
    container_name: ac_celery_worker
    entrypoint: ["celery"]
    command: ["-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - { path: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/backend.env", format: raw }
    volumes:
      - media_volume:/app/media
      - matrix_bridge_data:/data
    networks: [back, db, front]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  redis:
    <<: *service
    image: redis:7-alpine
    container_name: ac_redis
    volumes:
      - redis_data:/data
    networks: [back]

  db:
    <<: *service
    image: postgis/postgis:15-3.3
    container_name: ac_db
    env_file:
      - { path: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/db.env", format: raw }
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /home/sylvain/wal-archive:/wal_archive    # archivage WAL (backup-wal-ship.sh)
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -d assista-db"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ------------------------------------------------------------------ Matrix / Element
  synapse:
    <<: *service
    image: matrixdotorg/synapse:latest
    container_name: ac_synapse
    env_file:
      - { path: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/synapse.env", format: raw }
    volumes:
      - matrix_synapse_data:/data
      - /home/sylvain/matrix-synapse-modules:/modules:ro
    networks: [back, matrix-db]
    depends_on: [synapse-db]

  synapse-db:
    <<: *service
    image: postgres:15
    container_name: ac_synapse_db
    env_file:
      - { path: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/synapse-db.env", format: raw }
    volumes:
      - matrix_synapse_db_data:/var/lib/postgresql/data
    networks: [matrix-db]

  mas:
    <<: *service
    image: ghcr.io/element-hq/matrix-authentication-service:latest
    container_name: ac_mas
    command: ["server", "-c", "/data/config.yaml"]
    ports: ["172.16.1.114:8086:8080"]
    volumes:
      - matrix_mas_data:/data
    networks: [matrix-db, back]
    depends_on: [synapse-db]

  element-web:
    <<: *service
    image: vectorim/element-web:latest
    container_name: ac_element_web
    ports: ["172.16.1.114:8082:80"]
    volumes:
      - /home/sylvain/element-web-config-114/config.json:/app/config.json:ro
    networks: [back]

  matrix-bridge:
    <<: *service
    image: assista-crise-matrix-bridge:prod
    build: ./matrix-bridge
    container_name: ac_matrix_bridge
    env_file:
      - { path: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/matrix-bridge.env", format: raw }
    volumes:
      - matrix_bridge_data:/data
    networks: [back]
    depends_on: [synapse, backend]

  # ------------------------------------------------------------------ réseaux mesh (LoRa)
  meshcore-bridge:
    <<: *service
    image: assista-crise-meshcore-bridge:prod
    build: ./meshcore-bridge
    container_name: ac_meshcore_bridge
    env_file:
      - { path: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/meshcore-bridge.env", format: raw }
    networks: [back]
    depends_on: [backend]

  meshcore-proxy:                       # partage le compagnon MeshCore (un seul client TCP à la fois)
    <<: *service
    image: assista-crise-meshcore-proxy:prod
    build: ./meshcore-bridge
    container_name: ac_meshcore_proxy
    command: ["python", "-u", "proxy.py"]
    network_mode: host
    env_file:
      - { path: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/meshcore-proxy.env", format: raw }

  meshtastic-bridge:
    <<: *service
    image: assista-crise-meshtastic-bridge:prod
    build: ./meshtastic-bridge
    container_name: ac_meshtastic_bridge
    env_file:
      - { path: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/meshtastic-bridge.env", format: raw }
    networks: [back]
    depends_on: [backend]

  meshtastic-proxy:
    <<: *service
    image: assista-crise-meshtastic-proxy:prod
    build: ./meshtastic-bridge
    container_name: ac_meshtastic_proxy
    command: ["python", "-u", "proxy.py"]
    network_mode: host
    env_file:
      - { path: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/meshtastic-proxy.env", format: raw }

  # ------------------------------------------------------------------ broker MQTT (voir mosquitto/README.md)
  # Broker local des passerelles Meshtastic. Absent de .114 jusqu'au 06/11/2026 : les companions
  # pointaient tous vers un broker tiers (CompagnonMeshtastic.broker_host, défaut mqtt.gaulix.fr).
  mosquitto:
    <<: *service
    # `always` et non `unless-stopped`, par exception parmi les services applicatifs : la panne
    # d'un broker est MUETTE -- l'absence de trafic radio ne se distingue pas d'un réseau calme,
    # et personne ne s'en aperçoit avant d'avoir besoin du réseau, c'est-à-dire en crise. Même
    # raisonnement que pour la pile de supervision (voir x-service-supervision) : un arrêt à la
    # main ne doit pas survivre à un redémarrage de la machine.
    restart: always
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: ac_mqtt
    # Publié sur la SEULE IP du LAN, jamais sur 0.0.0.0 : Docker contourne UFW (§ 10.2), un port
    # publié sur 0.0.0.0 serait joignable depuis Internet malgré le pare-feu. Seuls les nœuds
    # radio du réseau local atteignent ce port ; aucune redirection sur la box.
    ports: ["172.16.1.114:1883:1883"]
    secrets: [mqtt_exporter_password, mqtt_pont_password, mqtt_passerelle1_password]
    # gid 10001 = appuser du backend, propriétaire des fichiers qu'il écrit dans le volume
    # partagé. Sans ce groupe supplémentaire, mosquitto (uid 1883) ne pourrait pas les lire --
    # ils sont en 0640, et des empreintes de mots de passe n'ont pas à être lisibles par tous.
    group_add: ["10001"]
    # Au premier démarrage seulement, le broker s'amorce depuis ses propres secrets : il ne
    # dépend donc jamais de l'application pour être utilisable. Ensuite c'est Django qui écrit
    # ces fichiers (/admin/comptes-mqtt), et la boucle de surveillance fait relire le broker dès
    # qu'ils changent -- `mosquitto_signal -a config-reload` envoie le SIGHUP qui fait relire
    # password_file et acl_file.
    # `$$` protège le `$` de l'interpolation Compose : le shell du conteneur reçoit bien `$(…)`.
    command:
      - sh
      - -c
      - >-
        C=/mosquitto/comptes;
        if [ ! -s "$$C/passwd" ]; then
          mosquitto_passwd -c -b "$$C/passwd" exporter "$$(cat /run/secrets/mqtt_exporter_password)" &&
          mosquitto_passwd -b "$$C/passwd" pont "$$(cat /run/secrets/mqtt_pont_password)" &&
          mosquitto_passwd -b "$$C/passwd" passerelle1 "$$(cat /run/secrets/mqtt_passerelle1_password)" &&
          cp /mosquitto/config/acl.114 "$$C/acl";
        fi;
        chmod 0640 "$$C/passwd" "$$C/acl";
        (
          precedent="";
          while sleep 10; do
            actuel=$$(stat -c %Y "$$C/passwd" "$$C/acl" 2>/dev/null | tr "\n" "-");
            if [ -n "$$actuel" ] && [ "$$actuel" != "$$precedent" ]; then
              precedent="$$actuel";
              mosquitto_signal -a config-reload 2>/dev/null || true;
            fi;
          done
        ) &
        exec mosquitto -c /mosquitto/config/mosquitto.114.conf
    volumes:
      - ./mosquitto/config/mosquitto.114.conf:/mosquitto/config/mosquitto.114.conf:ro
      - ./mosquitto/config/acl.114:/mosquitto/config/acl.114:ro
      - mosquitto_data:/mosquitto/data
      - mqtt_comptes:/mosquitto/comptes      # écrit par le backend, lu ici
    networks: [back, monitoring]         # back : le pont Meshtastic ; monitoring : l'exporteur

  # ------------------------------------------------------------------ monitoring (voir monitoring/README.md)
  prometheus:
    <<: *service-supervision
    image: assista-crise-prometheus:prod
    build: ./monitoring/prometheus
    container_name: ac_prometheus
    environment:
      - ENVIRONMENT=prod
    command:
      - '--config.file=/etc/prometheus/prometheus.114.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./monitoring/prometheus/prometheus.114.yml:/etc/prometheus/prometheus.114.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring, back]         # back : scrape de backend:8000/metrics

  alertmanager:
    <<: *service-supervision
    image: assista-crise-alertmanager:prod
    build: ./monitoring/alertmanager
    container_name: ac_alertmanager
    # Config locale (destinataires = vraies adresses, hors dépôt) : copie de alertmanager.prod.yml.
    command: ['--config.file=/etc/alertmanager/alertmanager.114.yml', '--storage.path=/alertmanager']
    secrets: [email_password, healthchecks_url]
    volumes:
      - /home/sylvain/.config/assista-crise/monitoring/alertmanager.114.yml:/etc/alertmanager/alertmanager.114.yml:ro
      - alertmanager_data:/alertmanager
    networks: [monitoring]

  grafana:
    <<: *service-supervision
    image: assista-crise-grafana:prod
    build: ./monitoring/grafana
    container_name: ac_grafana
    # Servi par le site sous /grafana/, en iframe dans /admin/monitoring (DOCUMENTATION.md,
    # « Monitoring ») : connexion par jeton court signé par le backend (core/grafana.py), vérifié
    # avec la clé publique. Le réseau grafana-proxy sert seulement à ac_proxy pour le joindre.
    # Port publié sur 127.0.0.1 seulement : accès de secours par tunnel SSH, compte local admin.
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://www.assista-crise.fr/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_JWT_ENABLED=true
      - GF_AUTH_JWT_URL_LOGIN=true
      - GF_AUTH_JWT_HEADER_NAME=X-JWT-Assertion
      - GF_AUTH_JWT_KEY_FILE=/run/secrets/grafana_jwt_public
      - GF_AUTH_JWT_EXPECT_CLAIMS={"iss":"assista-crise","aud":"grafana"}
      - GF_AUTH_JWT_USERNAME_CLAIM=sub
      - GF_AUTH_JWT_AUTO_SIGN_UP=true
      - GF_AUTH_JWT_ROLE_ATTRIBUTE_PATH=role
      - GF_AUTH_JWT_ROLE_ATTRIBUTE_STRICT=true
    secrets: [grafana_admin_password, grafana_jwt_public]
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [monitoring, grafana-proxy]
    depends_on: [prometheus, loki]

  # Journaux du WAF et de fail2ban -> pages admin Supervision WAF / Fail2ban (Grafana).
  loki:
    <<: *service-supervision
    image: grafana/loki:3.5.3
    container_name: ac_loki
    command: ['-config.file=/etc/loki/loki.yml']
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks: [monitoring]

  alloy:
    <<: *service-supervision
    image: grafana/alloy:v1.10.2
    container_name: ac_alloy
    # Lit les journaux (lecture seule) et n'envoie à Loki que des champs choisis : voir
    # monitoring/alloy/config.alloy (aucun en-tête Authorization/Cookie ni corps de requête).
    command: ['run', '--storage.path=/var/lib/alloy/data', '--server.http.listen-addr=0.0.0.0:12345', '/etc/alloy/config.alloy']
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - waf_modsec_logs:/logs/waf-modsec:ro
      - waf_nginx_logs:/logs/waf:ro
      - fail2ban_logs:/logs/fail2ban:ro
      # Lecture seule de l'API Docker, pour collecter la sortie des conteneurs applicatifs
      # (voir monitoring/alloy/config.alloy). Sans cela, les journaux du backend et du proxy
      # disparaissent a chaque redeploiement. Le socket donne un acces large au demon : il est
      # monte en :ro et Alloy n'ecrit jamais, mais c'est a connaitre.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitoring]
    depends_on: [loki]

  postgres-exporter:
    <<: *service-supervision
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ac_postgres_exporter
    environment:
      - DATA_SOURCE_URI=db:5432/assista-db?sslmode=disable
      - DATA_SOURCE_USER=monitoring
      - DATA_SOURCE_PASS_FILE=/run/secrets/pg_monitoring_password
    secrets: [pg_monitoring_password]
    networks: [monitoring, db]
    depends_on: [db]

  nginx-exporter:
    <<: *service-supervision
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: ac_nginx_exporter
    command: ['--nginx.scrape-uri=http://proxy:8081/stub_status']
    networks: [monitoring, front]
    depends_on: [proxy]

  # Métriques du broker (broker_clients_connected, messages…). Le compte `exporter` ne peut QUE
  # lire $SYS/# (voir mosquitto/config/acl.114). Ses identifiants arrivent par env_file hors
  # dépôt : cette image lit MQTT_USER/MQTT_PASS dans l'environnement, elle ne sait pas lire un
  # fichier de secret.
  mosquitto-exporter:
    <<: *service-supervision
    image: sapcc/mosquitto-exporter:0.8.0
    container_name: ac_mosquitto_exporter
    environment:
      - BROKER_ENDPOINT=tcp://mosquitto:1883
    env_file:
      - { path: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/mqtt-exporter.env", format: raw }
    networks: [monitoring]
    depends_on: [mosquitto]

  cadvisor:
    <<: *service-supervision
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ac_cadvisor
    privileged: true                     # compromis assumé : accès large à l'hôte, port jamais publié
    devices: [/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]

  node-exporter:
    <<: *service-supervision
    image: prom/node-exporter:v1.8.2
    container_name: ac_node_exporter
    pid: host
    command: ['--path.rootfs=/host']
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]

  blackbox-exporter:
    <<: *service-supervision
    image: prom/blackbox-exporter:v0.25.0
    container_name: ac_blackbox_exporter
    networks: [monitoring]

secrets:
  grafana_admin_password: { file: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/grafana_admin_password.txt" }
  pg_monitoring_password: { file: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/pg_monitoring_password.txt" }
  email_password:         { file: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/email_password.txt" }
  grafana_jwt_public:     { file: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/grafana_jwt_public.pem" }
  # URL de ping du dead man's switch (healthchecks.io). C'est un secret : qui la connaît peut
  # envoyer de faux battements et faire taire le seul dispositif capable de signaler l'arrêt de
  # Prometheus -- donc jamais dans le dépôt, et jamais en clair dans une variable d'environnement.
  healthchecks_url:       { file: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/healthchecks_url.txt" }
  # Comptes du broker MQTT (mosquitto/config/acl.114). Un fichier par compte : révoquer une
  # passerelle ne doit pas obliger à changer les autres mots de passe.
  mqtt_exporter_password:    { file: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/mqtt_exporter_password.txt" }
  mqtt_pont_password:        { file: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/mqtt_pont_password.txt" }
  mqtt_passerelle1_password: { file: "${SECRETS_DIR:-/home/sylvain/.config/assista-crise/secrets}/mqtt_passerelle1_password.txt" }

# Réseaux existants (créés à la main avant compose) : jamais recréés -- ac_waf, les sauvegardes et
# les satellites s'y rattachent par nom.
networks:
  front:     { external: true, name: assista-front }
  back:      { external: true, name: assista-back }
  db:        { external: true, name: assista-db }
  matrix-db: { external: true, name: assista-matrix-db }
  monitoring: { name: assista-monitoring }
  # ac_proxy <-> ac_grafana uniquement.
  grafana-proxy:
    name: assista-grafana-proxy
    ipam:
      config: [{ subnet: 172.31.250.0/29 }]

volumes:
  postgres_data:          { external: true, name: assista-crise_postgres_data }
  media_volume:           { external: true, name: assista-crise_media_volume }
  matrix_bridge_data:     { external: true, name: matrix_bridge_data_114 }
  matrix_mas_data:        { external: true, name: matrix_mas_data_114 }
  matrix_synapse_data:    { external: true, name: matrix_synapse_data_114 }
  matrix_synapse_db_data: { external: true, name: matrix_synapse_db_data }
  proxy_nginx_logs:       { external: true, name: proxy_nginx_logs }
  ssh_journal_logs:       { external: true, name: ssh_journal_logs }
  waf_modsec_logs:        { external: true, name: waf_modsec_logs }
  waf_nginx_logs:         { external: true, name: waf_nginx_logs }
  # Jetons de validation ACME HTTP-01 des domaines partenaires : écrits par certbot,
  # lus par ac_waf (voir proxy/waf-partenaires-acme.conf).
  certbot_webroot:        { name: ac_certbot_webroot }
  # Anciens volumes anonymes (sans nom) de ac_fail2ban et redis : copiés dans ces volumes nommés
  # par migrer-vers-compose.sh.
  fail2ban_data:          { external: true, name: ac_fail2ban_data }
  redis_data:             { external: true, name: ac_redis_data }
  prometheus_data:        { name: ac_prometheus_data }
  alertmanager_data:      { name: ac_alertmanager_data }
  grafana_data:           { name: ac_grafana_data }
  loki_data:              { name: ac_loki_data }
  alloy_data:             { name: ac_alloy_data }
  mosquitto_data:         { name: ac_mqtt_data }
  # Comptes du broker : écrits par le backend (uid 10001), lus par ac_mqtt (uid 1883, qui reçoit
  # le gid 10001 en groupe supplémentaire). Ne contient que des empreintes, jamais de mot de passe.
  mqtt_comptes:           { name: ac_mqtt_comptes }
  fail2ban_logs:          { name: ac_fail2ban_logs }
