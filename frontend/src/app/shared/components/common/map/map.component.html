<div class="map-container">
    <div class="map-frame" #mapContainer style="width: 100%; height: 100%;"></div>

    @if (!layersPanelOpen) {
      <button type="button" class="layer-toggle-fab" (click)="layersPanelOpen = true" title="Afficher les calques">
        <span class="material-icons">layers</span>
      </button>
    }

    @if (layersPanelOpen) {
    <div class="layer-toggle-panel">
      <div class="layer-toggle-title">
        Calques
        <button type="button" class="layer-toggle-close" (click)="layersPanelOpen = false" title="Fermer">
          <span class="material-icons">close</span>
        </button>
      </div>
      <label class="layer-toggle-item">
        <input type="checkbox" [(ngModel)]="layerVisibility.crises" (ngModelChange)="onLayerToggle()">
        <span class="layer-dot crises-dot"></span>
        Zones de crise
      </label>
      <label class="layer-toggle-item">
        <input type="checkbox" [(ngModel)]="layerVisibility.requests" (ngModelChange)="onLayerToggle()">
        <span class="layer-dot requests-dot"></span>
        Demandes
      </label>
      <label class="layer-toggle-item">
        <input type="checkbox" [(ngModel)]="layerVisibility.offers" (ngModelChange)="onLayerToggle()">
        <span class="layer-dot offers-dot"></span>
        Offres
      </label>
      <label class="layer-toggle-item">
        <input type="checkbox" [(ngModel)]="layerVisibility.informations" (ngModelChange)="onLayerToggle()">
        <span class="layer-dot informations-dot"></span>
        Signalements
      </label>
      <label class="layer-toggle-item">
        <input type="checkbox" [(ngModel)]="layerVisibility.centresHebergement" (ngModelChange)="onLayerToggle()">
        <span class="layer-dot centres-hebergement-dot"></span>
        Centres d'hébergement / accueil
      </label>
      <label class="layer-toggle-item">
        <input type="checkbox" [(ngModel)]="layerVisibility.postesSecours" (ngModelChange)="onLayerToggle()">
        <span class="layer-dot postes-secours-dot"></span>
        Postes de secours / soins
      </label>
      @if (isInstitutional) {
        <label class="layer-toggle-item">
          <input type="checkbox" [(ngModel)]="layerVisibility.positions" (ngModelChange)="onLayerToggle()">
          <span class="layer-dot positions-dot"></span>
          Positions équipes
        </label>
        <label class="layer-toggle-item">
          <input type="checkbox" [(ngModel)]="layerVisibility.personnelSecourisme" (ngModelChange)="onLayerToggle()">
          <span class="layer-dot personnel-dot"></span>
          Personnel secourisme
        </label>
        <label class="layer-toggle-item">
          <input type="checkbox" [(ngModel)]="layerVisibility.centresTous" (ngModelChange)="onLayerToggle()">
          <span class="layer-dot centres-dot"></span>
          Centres (tous types)
        </label>
      }
    </div>
    }
</div>
