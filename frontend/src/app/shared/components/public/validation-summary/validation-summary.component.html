@if (errors.length > 0) {
  <div class="validation-summary" role="alert">
    <span class="material-icons">error_outline</span>
    <div>
      <p class="validation-summary-title">Merci de corriger les points suivants :</p>
      <ul>
        @for (error of errors; track error) {
          <li>{{ error }}</li>
        }
      </ul>
    </div>
  </div>
}
