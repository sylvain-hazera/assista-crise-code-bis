<div class="admin-layout" 
     [class.sidebar-collapsed]="sidebarCollapsed && !isMobile"
     [class.sidebar-open]="sidebarOpen && isMobile">
  
  <app-admin-header
    class="admin-header"
    [currentUser]="currentUser"
    [isMobile]="isMobile"
    [sidebarCollapsed]="sidebarCollapsed"
    (toggleSidebar)="toggleSidebar()"
    (menusOuvertsChange)="onMenusOuverts($event)"
    (deconnexion)="logout()">
  </app-admin-header>

  <app-admin-sidebar
    class="admin-sidebar"
    [class.open]="sidebarOpen && isMobile"
    [collapsed]="sidebarCollapsed && !isMobile"
    (navigation)="onNavItemClick()"
    (deconnexion)="logout()">
  </app-admin-sidebar>

  <!-- Main Content -->
  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>

</div>

<!-- Overlays -->
@if (menusOuverts) {
  <div class="dropdown-overlay" (click)="closeAllMenus()"></div>
}

@if (sidebarOpen && isMobile) {
  <div class="sidebar-overlay" (click)="closeSidebar()"></div>
}
