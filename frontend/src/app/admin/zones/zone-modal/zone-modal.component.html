<div class="modal-overlay" (click)="close()">
  <div class="modal" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <h2>{{ isEdit ? 'Modifier la zone' : 'Nouvelle zone' }}</h2>
      <button class="icon-btn" (click)="close()"><span class="material-icons">close</span></button>
    </div>

    <form class="modal-body" [formGroup]="form" (ngSubmit)="submit()">

      <div class="form-group">
        <label>Nom <span class="required">*</span></label>
        <input type="text" formControlName="nom" placeholder="Ex: Quartier Nord">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea formControlName="description" rows="2" placeholder="Description de la zone (optionnel)"></textarea>
      </div>

      <div class="form-group">
        <label>Communes</label>
        <div class="chip-list">
          @for (code of communes; track code) {
            <span class="chip">
              {{ communeNoms[code] || code }}
              <button type="button" (click)="removeCommune(code)">×</button>
            </span>
          }
          @if (communes.length === 0) {
            <span class="chip-empty">Aucune commune ajoutée.</span>
          }
        </div>
        <app-tag-search-input
          placeholder="Ajouter une commune (nom, code postal ou code INSEE)…"
          labelField="name"
          [searchFn]="communeSearchFn"
          emptyMessage="Aucune commune ne correspond."
          (itemSelected)="addCommune($event)">
        </app-tag-search-input>
      </div>

      <div class="form-group">
        <label>Zone précise (dessinée), optionnelle</label>
        <app-zone-map [initialZone]="initialZoneGeojson" (zoneChange)="onZoneChange($event)"></app-zone-map>
      </div>

      @if (errorMessage) {
        <p class="error-message">{{ errorMessage }}</p>
      }

      <div class="modal-actions">
        <button type="submit" class="btn-primary" [disabled]="saving">
          {{ isEdit ? 'Enregistrer' : 'Créer la zone' }}
        </button>
        <button type="button" class="btn-secondary" (click)="close()">Annuler</button>
      </div>

    </form>

  </div>
</div>
