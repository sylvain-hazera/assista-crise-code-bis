<div class="monitoring-page">

  <header class="monitoring-header">
    <div class="monitoring-title">
      <span class="material-icons title-icon">monitor_heart</span>
      <h1>Monitoring</h1>
    </div>
    @if (urlIframe) {
      <a class="btn-secondary" [href]="urlPleinEcran" target="_blank" rel="noopener">
        <span class="material-icons">open_in_new</span>
        Ouvrir Grafana
      </a>
    }
  </header>

  @if (errorMessage) {
    <p class="monitoring-error">{{ errorMessage }}</p>
  } @else if (urlIframe) {
    <iframe class="monitoring-frame" [src]="urlIframe" title="Tableau de bord Grafana"></iframe>
  } @else {
    <p class="monitoring-loading">Chargement du tableau de bord…</p>
  }

</div>
