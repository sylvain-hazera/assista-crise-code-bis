server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html référence les chunks JS/CSS par nom haché (change à chaque build) : sans
    # Cache-Control explicite, certains navigateurs (mobile notamment) le mettent en cache de
    # façon heuristique (Last-Modified/ETag seuls) et continuent de charger un ancien bundle
    # après un redéploiement, jusqu'à ce que le cache expire de lui-même — jamais acceptable
    # pour le point d'entrée de l'app. Toujours revalidé, jamais servi tel quel sans vérifier.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Chunks JS/CSS Angular : nom de fichier haché sur le contenu, donc sûr de mettre en cache
    # long terme — un nouveau build produit toujours un nouveau nom.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}