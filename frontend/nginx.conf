# Les variables $seo_* viennent de /etc/nginx/conf.d/00-referencement.conf, fabrique a la
# construction de l'image par scripts/generer-referencement.mjs (voir Dockerfile.prod) a
# partir de src/app/seo/referencement.json et des routes du site. Rien de propre a une marque
# ou a une page ne s'ecrit ici.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Une redirection relative suit le nom et le protocole que le visiteur a employes : ce
    # serveur est derriere deux relais et ne connait ni l'un ni l'autre.
    absolute_redirect off;

    # Scripts et styles partaient non compresses (253 Ko a l'ouverture du site). Les relais en
    # amont transmettent la demande de compression et la reponse telles quelles.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.0;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json application/xml
               image/svg+xml text/plain application/manifest+json;

    # --- En-tete de la page, par marque et par page ------------------------------------------
    # Le site est une application : sans cela, un lien partage (WhatsApp, SMS, reseaux
    # sociaux) et un moteur qui n'execute pas le JavaScript ne lisaient que « Assista Crise »,
    # quel que soit le domaine. Le site affine ensuite a chaque changement de page (voir
    # ReferencementService), a partir du meme fichier.
    # Ne remplace que la page d'entree : les deux chaines cherchees n'existent que dans
    # index.html (scripts/tester-referencement.sh echoue si ce n'est plus le cas).
    sub_filter_once on;
    sub_filter '<title>Assista Crise</title>' '<title>$seo_titre</title>
  <meta name="description" content="$seo_description">
  $seo_canonique
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="$seo_nom">
  <meta property="og:title" content="$seo_titre">
  <meta property="og:description" content="$seo_description">
  <meta property="og:url" content="https://$host$seo_chemin">
  <meta property="og:image" content="https://$host/api/branding/logo/">
  <meta name="twitter:card" content="summary">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"$seo_nom","url":"https://$host/"}</script>';
    sub_filter '<app-root></app-root>' '<app-root></app-root>
  <noscript><h1>$seo_nom</h1><p>$seo_description_marque</p><p>Ce site a besoin de JavaScript pour fonctionner.</p></noscript>';

    # index.html référence les chunks JS/CSS par nom haché (change à chaque build) : sans
    # Cache-Control explicite, certains navigateurs (mobile notamment) le mettent en cache de
    # façon heuristique (Last-Modified/ETag seuls) et continuent de charger un ancien bundle
    # après un redéploiement, jusqu'à ce que le cache expire de lui-même — jamais acceptable
    # pour le point d'entrée de l'app. Toujours revalidé, jamais servi tel quel sans vérifier.
    # « always » : la page est aussi servie avec le statut 404 (voir @application).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # Vide pour une page referencee d'un hote reference : nginx n'envoie alors pas
        # l'en-tete. Toutes les autres pages (liens a jeton, espace connecte, administration)
        # sont servies avec l'interdiction d'indexer.
        add_header X-Robots-Tag $seo_robots always;
    }

    # Application mobile : même adresse d'une version à l'autre. Toujours revalidée, sinon un
    # téléphone téléchargerait l'ancien APK, ou lirait un version.json périmé et ne verrait
    # jamais la mise à jour.
    location /mobile/ {
        add_header Cache-Control "no-cache" always;
    }

    # Chunks JS/CSS Angular : nom de fichier haché sur le contenu, donc sûr de mettre en cache
    # long terme — un nouveau build produit toujours un nouveau nom.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /api/ n'est PAS interdit aux robots : un moteur qui execute le site doit pouvoir lire
    # la marque et les crises pour voir la page. L'indexation des reponses de l'API est
    # interdite par en-tete, au relais (proxy/nginx.conf).
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /admin/\n\nSitemap: https://$host/sitemap.xml\n";
    }

    # Servi en text/xml : nginx deduit le type de l'extension de l'adresse.
    location = /sitemap.xml {
        return 200 $seo_plan_du_site;
    }

    location / {
        # Pages de l'ancien site que les moteurs proposent encore.
        if ($seo_ancienne_adresse) {
            return 301 $seo_ancienne_adresse;
        }
        try_files $uri $uri/ @application;
    }

    # Aucun fichier a cette adresse : c'est une page de l'application, ou rien du tout.
    # Une adresse que le site ne connait pas recoit la page d'entree AVEC le statut 404 :
    # le visiteur voit le site comme avant (il est ramene a l'accueil), le moteur comprend
    # que la page n'existe pas.
    location @application {
        error_page 404 /index.html;
        if ($seo_inconnue) {
            return 404;
        }
        rewrite ^ /index.html last;
    }
}
