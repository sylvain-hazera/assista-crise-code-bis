# Validation ACME (HTTP-01) des domaines de marque blanche -- monté dans ac_waf comme
# /etc/nginx/templates/conf.d/partenaires-acme.conf.template (voir docker-compose.114.yml).
#
# POURQUOI CE BLOC EXISTE
# Le bloc :8080 par défaut de l'image (default_server) redirige TOUT en 301 vers HTTPS. Let's
# Encrypt suivrait cette redirection vers un certificat qui ne couvre pas encore le domaine
# demandé : la validation échouerait. Ce bloc-ci, plus spécifique par son server_name, sert le
# jeton de validation en clair et redirige le reste exactement comme avant.
#
# POURQUOI HTTP-01 ET PAS DNS-01
# Le certificat d'assista-crise.fr est émis par DNS-01 via IONOS ; ces identifiants ne couvrent
# QUE la zone assista-crise.fr, jamais le domaine propre d'un partenaire (voir README). Le CNAME
# du partenaire pointant chez nous, HTTP-01 fonctionne sans rien lui demander de plus.
#
# À TENIR À JOUR
# Tout nouveau domaine partenaire doit être ajouté à server_name ici, sinon son certificat ne
# pourra être ni émis ni RENOUVELÉ (le renouvellement automatique repasse par ce chemin).
#
# ModSecurity reste actif : il est activé au niveau http{} (conf.d/modsecurity.conf), donc
# hérité par ce bloc comme par les autres.
server {
    listen 8080;
    server_name app.reserve-resilience.org auth.reserve-resilience.org
                chat.reserve-resilience.org matrix.reserve-resilience.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
