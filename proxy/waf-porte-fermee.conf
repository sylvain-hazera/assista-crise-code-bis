# Porte fermée aux connexions qui ne visent aucun de nos noms -- monté dans ac_waf comme
# /etc/nginx/templates/conf.d/porte-fermee.conf.template (voir docker-compose.114.yml).
#
# POURQUOI (15/11/2026)
# Les moteurs qui recensent Internet (Shodan, Censys, LeakIX...) et les scanners se connectent
# à l'ADRESSE IP, sans nom de domaine. Jusqu'ici ils recevaient le certificat d'assista-crise.fr
# -- donc la liste de nos noms -- puis une réponse du proxy (421), et sur le port 80 une
# redirection. Sur sept semaines de journal, c'est l'essentiel des 39 000 requêtes de scan.
#
# Désormais une connexion venue d'Internet sans nom connu ne reçoit RIEN : un certificat
# auto-signé anonyme (celui que l'image génère à son démarrage), puis la connexion est coupée
# (444). ModSecurity ne travaille pas pour elle, le proxy et Django ne la voient pas, et le
# journal d'accès porte un statut 444 que la règle fail2ban « scanner » bannit aussitôt.
#
# CE QUI NE CHANGE PAS
# - Le réseau local et la machine elle-même continuent d'utiliser le site par son adresse
#   (https://172.16.1.114) : des téléphones et des postes le font, la supervision aussi. Seul
#   leur avertissement de certificat change (auto-signé au lieu de « nom différent »).
# - Tous les noms en assista-crise.fr et reserve-resilience.org passent comme avant.
#
# ⚠ NOUVEAU DOMAINE (marque blanche) : il doit avoir son bloc `server` nommé sur 8443 (voir
# waf-partenaires-tls.conf) ET sur 8080 (waf-partenaires-acme.conf), sinon il tombe ici et
# la connexion est coupée. Ajouter aussi son suffixe à la liste du bloc 8080 ci-dessous.

# 1 = réseau local, conteneurs, machine elle-même. Même périmètre que `ignoreip` de fail2ban.
# $realip_remote_addr est l'adresse de la connexion TCP : un en-tête ne peut pas la falsifier.
geo $realip_remote_addr $ac_reseau_local {
    default        0;
    127.0.0.0/8    1;
    172.16.0.0/12  1;
}

# ── Port 80 : nom absent ou qui n'est pas des nôtres ─────────────────────────────────────────
# Le bloc par défaut de l'image garde son rôle (redirection vers HTTPS) pour nos noms ; les
# noms exacts l'emportent toujours sur cette expression.
server {
    listen 8080;
    server_name "" "~^(?!(?:.*\.)?(?:assista-crise\.fr|reserve-resilience\.org|assista-crise\.duckdns\.org)$)";

    if ($ac_reseau_local = 0) {
        return 444;
    }
    location / {
        return 301 https://$host$request_uri;
    }
    include includes/location_common.conf;
}

# ── Port 443 : bloc par défaut ───────────────────────────────────────────────────────────────
# Reçoit toute poignée de main TLS sans nom (SNI) ou au nom inconnu, et toute requête dont
# l'en-tête Host ne correspond à aucun autre bloc.
#
# Le certificat est celui que l'image owasp/modsecurity-crs génère à chaque création du
# conteneur (CN=localhost) : il ne dit rien de nous. Si une future image cessait de le
# produire, nginx refuserait de démarrer -- le script de déploiement fait un `nginx -t` dans un
# conteneur jetable AVANT de recréer ac_waf.
server {
    listen 8443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/conf/server.crt;
    ssl_certificate_key /etc/nginx/conf/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    if ($ac_reseau_local = 0) {
        return 444;
    }

    client_max_body_size 0;

    location / {
        include includes/cors.conf;
        include includes/proxy_backend.conf;
    }

    include includes/location_common.conf;
}

# ── Port 443 : les noms en assista-crise.fr que le bloc de l'image ne nomme pas ──────────────
# Le bloc de l'image ne nomme que assista-crise.fr, www. et cj. ; auth., chat. et matrix. lui
# arrivaient parce qu'il était le bloc par défaut. Il ne l'est plus : ce bloc-ci les reprend,
# avec le même certificat et les mêmes paramètres (copie de waf-partenaires-tls.conf).
server {
    listen 8443 ssl;
    server_name *.assista-crise.fr assista-crise.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/assista-crise.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assista-crise.fr/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_dhparam /etc/ssl/certs/dhparam-2048.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;

    client_max_body_size 0;

    location / {
        include includes/cors.conf;
        include includes/proxy_backend.conf;
    }

    include includes/location_common.conf;
}
