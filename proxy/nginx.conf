limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_status 429;

# Le WAF (ac_waf, ModSecurity + OWASP CRS) est désormais le seul point d'entrée public :
# il termine le TLS et fait tourner CRS avant de relayer ici en clair, sur le réseau
# docker interne. On restitue donc la vraie IP cliente à partir du header qu'il pose,
# sinon $remote_addr vaudrait toujours l'IP du conteneur WAF (rate limiting cassé).
set_real_ip_from 172.20.0.0/16;
real_ip_header X-Real-IP;
real_ip_recursive on;

access_log /var/log/nginx-real/access.log;
error_log /var/log/nginx-real/error.log warn;

server {
    client_max_body_size 20M;
    listen 80;
    server_name assista-crise.fr;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Points d'entrée d'authentification : rate limitées contre le brute-force.
    location /api/token/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/magic-login/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/activate-account/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Tout ce qui commence par /api va vers le Backend Python
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # L'interface d'admin Django
    location /django-admin {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Documents de dossier : jamais servis en direct, uniquement via les actions
    # /api/documents/{id}/download|preview/ qui vérifient les droits d'accès à chaque
    # appel (check_document_access) — contrairement à ce chemin statique qui, lui,
    # ne vérifie rien du tout.
    location /media/documents/ {
        return 403;
    }

    # Photos de crise/offre/demande/information : mêmes raisons — uniquement via les
    # actions /api/.../{id}/preview/ (user_can_view_photo), jamais en accès direct.
    location /media/photos/ {
        return 403;
    }

    # Photos de recherche de personne (fiche + photos de commentaires) : idem.
    location /media/recherches/ {
        return 403;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Le reste va vers le Frontend Angular
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
