server {
    listen 80;
    server_name assista-crise.duckdns.org;

    # Redirection vers HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name assista-crise.duckdns.org;

    # Nginx va lire ça dans le volume qu'on vient de monter
    ssl_certificate /etc/letsencrypt/live/assista-crise.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assista-crise.duckdns.org/privkey.pem;


    # Tout ce qui commence par /api va vers le Backend Python
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # L'interface d'admin Django
    location /admin {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Le reste va vers le Frontend Angular
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}