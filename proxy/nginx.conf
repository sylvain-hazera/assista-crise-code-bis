limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_status 429;

# Le WAF (ac_waf, ModSecurity + OWASP CRS) est désormais le seul point d'entrée public :
# il termine le TLS et fait tourner CRS avant de relayer ici en clair, sur le réseau
# docker interne. On restitue donc la vraie IP cliente à partir du header qu'il pose,
# sinon $remote_addr vaudrait toujours l'IP du conteneur WAF (rate limiting cassé).
set_real_ip_from 172.20.0.0/16;
real_ip_header X-Real-IP;
real_ip_recursive on;

access_log /var/log/nginx-real/access.log;
error_log /var/log/nginx-real/error.log warn;

server {
    client_max_body_size 20M;
    listen 80;
    server_name assista-crise.fr;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Points d'entrée d'authentification : rate limitées contre le brute-force.
    location /api/token/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/magic-login/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/activate-account/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Tout ce qui commence par /api va vers le Backend Python
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SSO Matrix (voir OAUTH2_PROVIDER côté backend, core/oidc.py) : /o/authorize/ est la page
    # de connexion atteinte par le navigateur de l'utilisateur (redirigé depuis Synapse/Element,
    # servis sur des ports dédiés hors WAF, voir doc de conception "Matrix / Element") --
    # rate-limitée comme les autres points d'authentification.
    location /o/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Page de connexion générique (voir /o/ ci-dessus) -- accessible à N'IMPORTE QUEL
    # utilisateur actif, contrairement à /django-admin/login réservé aux is_staff.
    location /accounts/login/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # L'interface d'admin Django
    location /django-admin {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Documents de dossier : jamais servis en direct, uniquement via les actions
    # /api/documents/{id}/download|preview/ qui vérifient les droits d'accès à chaque
    # appel (check_document_access) — contrairement à ce chemin statique qui, lui,
    # ne vérifie rien du tout.
    location /media/documents/ {
        return 403;
    }

    # Photos de crise/offre/demande/information : mêmes raisons — uniquement via les
    # actions /api/.../{id}/preview/ (user_can_view_photo), jamais en accès direct.
    location /media/photos/ {
        return 403;
    }

    # Photos de recherche de personne (fiche + photos de commentaires) : idem.
    location /media/recherches/ {
        return 403;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Le reste va vers le Frontend Angular
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# --- Marque blanche Réserve Résilience / Casques Jaunes (voir core/branding.py,
# InstitutionWebDomaine) -- MÊMES conteneurs frontend/backend que le bloc principal
# ci-dessus, c'est tout : seul le Host transmis diffère, c'est lui que le backend utilise pour
# résoudre le branding (logo/couleurs/signature email). app.reserve-resilience.org est pointé
# en CNAME par le partenaire sur cj.assista-crise.fr -- le navigateur envoie le Host
# RÉELLEMENT visité (jamais la cible du CNAME), donc les deux doivent être déclarés comme
# server_name ici, pas seulement cj.assista-crise.fr.
#
# IMPORTANT (hors dépôt, TLS terminé par ac_waf) : ces deux hostnames doivent aussi être
# ajoutés aux SAN du certificat (même processus que matrix./auth./chat. ci-dessous) et à
# l'allowlist server_name du WAF, sans quoi ce bloc ne reçoit jamais de trafic.
server {
    client_max_body_size 20M;
    listen 80;
    server_name cj.assista-crise.fr app.reserve-resilience.org;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/token/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/magic-login/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/activate-account/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /django-admin {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /media/documents/ { return 403; }
    location /media/photos/ { return 403; }
    location /media/recherches/ { return 403; }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# --- Sous-domaines Matrix/Element (.114 uniquement, voir doc de conception "Matrix /
# Element") -- routés par Host via le même WAF/certificat que le domaine principal (SAN
# ajoutées au certificat assista-crise.fr -- mécanique du partage WAF/certificat documentée
# dans proxy/README.md, y compris le piège "--expand" rencontré en ajoutant
# cj.assista-crise.fr), plus besoin de ports dédiés côté .114 contrairement à .113 (pas de
# certificat valide pour son IP LAN, voir bloc :8085 ci-dessous, conservé pour .113 seulement).

server {
    listen 80;
    server_name matrix.assista-crise.fr;
    client_max_body_size 50M;

    location / {
        proxy_pass http://synapse:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name auth.assista-crise.fr;

    location / {
        proxy_pass http://mas:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name chat.assista-crise.fr;

    location / {
        proxy_pass http://element-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# SSO Matrix en clair, port dédié hors WAF (voir doc de conception "Matrix / Element") --
# le certificat HTTPS du domaine principal (assista-crise.fr) ne correspond pas à l'IP LAN
# 172.16.1.114 (anciennement .113, retirée le 2026-09-28) utilisée par Synapse/Element pour
# joindre cette page depuis un client mobile ;
# un navigateur classique laisse passer outre l'avertissement, mais le navigateur intégré
# qu'utilise Element X pour le flux SSO le refuse silencieusement (écran qui s'ouvre puis ne
# fait plus rien, constaté avec Sylvain le 24/09). Même compromis HTTP-LAN-only que Synapse
# (8008) et Element Web (8082) -- pas de TLS, mais uniquement /o/ et /accounts/login/ exposés
# ici, jamais /api/ ni /django-admin (qui restent exclusivement derrière le WAF/HTTPS).
server {
    listen 8085;
    server_name _;

    location /o/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /accounts/login/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }
}

# --- Monitoring : statistiques lues par nginx-exporter. Port 8081 jamais publié ; filtre IP en sécurité.
server {
    listen 8081;
    access_log off;
    location /stub_status {
        stub_status;
        allow 172.16.0.0/12;   # réseaux Docker
        deny all;
    }
}
