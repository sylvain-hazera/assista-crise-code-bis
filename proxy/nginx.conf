limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_status 429;

# Le WAF (ac_waf, ModSecurity + OWASP CRS) est désormais le seul point d'entrée public :
# il termine le TLS et fait tourner CRS avant de relayer ici en clair, sur le réseau
# docker interne. On restitue donc la vraie IP cliente à partir du header qu'il pose,
# sinon $remote_addr vaudrait toujours l'IP du conteneur WAF (rate limiting cassé).
set_real_ip_from 172.20.0.0/16;
real_ip_header X-Real-IP;
real_ip_recursive on;

# Le jeton Grafana (?auth_token=, voir location /grafana/) ne doit pas finir dans les journaux,
# ni dans l'URL demandée ni dans le Referer des requêtes envoyées depuis l'iframe.
map $request $request_masque {
    "~^(?<avant>.*[?&]auth_token=)[^& ]+(?<apres>.*)$" "${avant}MASQUE${apres}";
    default $request;
}
map $http_referer $referer_masque {
    "~^(?<avant>.*[?&]auth_token=)[^&]+(?<apres>.*)$" "${avant}MASQUE${apres}";
    default $http_referer;
}
log_format masque '$remote_addr - $remote_user [$time_local] "$request_masque" '
                  '$status $body_bytes_sent "$referer_masque" "$http_user_agent"';

access_log /var/log/nginx-real/access.log masque;
error_log /var/log/nginx-real/error.log warn;

# Grafana (profil monitoring) est résolu à chaque requête via le DNS de Docker : un upstream
# écrit en dur serait résolu au démarrage, et nginx refuserait de démarrer (tout le site
# tomberait) quand Grafana n'est pas lancé. Ici, seul /grafana/ répond alors 502.
resolver 127.0.0.11 valid=10s ipv6=off;

# Websocket de Grafana Live
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Connexions persistantes réutilisées vers backend et frontend. Sans elles, le proxy ouvrait
# une connexion TCP par requête et épuisait ses ports source éphémères sous charge (erreur
# "Address not available" -> 502 alors que backend/frontend étaient au repos, constaté au test
# de charge du 20/10/2026 dès ~780 req/s). Le nom (backend/frontend) est résolu au démarrage/
# reload comme avant, scripts/114/deployer.sh recharge le proxy après un déploiement backend/
# frontend.
upstream backend_app  { server backend:8000; keepalive 64; }
upstream frontend_app { server frontend:80;  keepalive 64; }

# HTTP/1.1 : requis pour que le pool keepalive ci-dessus s'active (hérité par toutes les
# locations). Chaque location proxyée repose en plus Connection "" juste après son proxy_pass :
# un proxy_set_header dans une location remplace TOUS ceux hérités, Connection comprise.
proxy_http_version 1.1;

# Bloc par defaut : toute requete dont le Host n'est pas un domaine du projet est refusee ICI.
#
# POURQUOI CE BLOC EXISTE
# Sans lui, nginx envoie une requete au Host inconnu au PREMIER bloc declare (celui
# d'assista-crise.fr, juste en dessous), qui la relaie a Django avec proxy_set_header Host
# $host. Django leve alors DisallowedHost, ce qui remonte en ERROR dans le journal et declenche
# une alerte Matrix. Une IP publique recoit en permanence des scans avec un Host arbitraire :
# c'etait la premiere source de bruit des alertes (constate le 12/11/2026). Le portier doit
# etre nginx, pas Django.
#
# POURQUOI 421 ET PAS 444
# 444 est l'idiome nginx habituel, mais il ferme la connexion SANS reponse. Or ce proxy n'est
# plus le point d'entree : ac_waf est devant et relaie ici. Une fermeture seche lui ferait
# journaliser "upstream prematurely closed connection" et renvoyer un 502 -- on remplacerait un
# bruit par un autre. 421 (Misdirected Request) dit exactement la bonne chose, traverse le WAF
# proprement et ne coute aucun worker Django.
#
# A TENIR A JOUR : tout nouveau domaine servi doit etre ajoute au server_name du bloc qui le
# sert, sinon il tombe ici et renvoie 421. Les blocs plus bas (cj./app., matrix., auth., chat.)
# ont leur propre server_name et ne sont pas concernes.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    return 421;
}

server {
    client_max_body_size 20M;
    listen 80;
    # Tous les Host servis par ce bloc sont nommes explicitement : il n'est plus le bloc par
    # defaut (voir ci-dessus). 172.16.1.114 est l'adresse sondee par blackbox-exporter
    # (job blackbox-https de prometheus.114.yml) ; localhost/127.0.0.1 servent aux tests
    # depuis la machine elle-meme. Tous figurent deja dans ALLOWED_HOSTS.
    server_name assista-crise.fr www.assista-crise.fr demo.assista-crise.fr
                assista-crise.duckdns.org
                172.16.1.114 localhost 127.0.0.1;
    # remplacent les journaux hérités (dont celui de l'image nginx, non masqué) : bloc de /grafana/
    access_log /var/log/nginx/access.log masque;
    access_log /var/log/nginx-real/access.log masque;
    set $grafana http://grafana:3000;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Lien court public vers le dossier de présentation remis à la Préfecture (candidature à la
    # labellisation Journées Nationales de la Résilience). Servi DIRECTEMENT par nginx depuis
    # proxy/public/ : ni Angular ni le backend ne sont sollicités, et le fichier se remplace sans
    # reconstruire quoi que ce soit (simple bind mount, voir docker-compose.114.yml).
    #
    # `location =` : correspondance EXACTE, prioritaire sur le `location /` plus bas qui
    # renverrait l'application Angular (laquelle renvoie l'accueil pour toute route inconnue).
    #
    # Contenu public et assumé : document de présentation du projet, dont les captures d'écran
    # viennent toutes de la zone de démonstration (adresses @zone.demo, noms fictifs).
    location = /prefecture {
        alias /var/www/public/dossier-prefecture.pdf;
        default_type application/pdf;
        # Ouvre l'aperçu du navigateur plutôt que de forcer l'enregistrement : le destinataire
        # télécharge en un clic s'il le veut. `attachment` à la place pour forcer la boîte de
        # dialogue d'enregistrement.
        add_header Content-Disposition 'inline; filename="Assista-Crise-Dossier-Prefecture.pdf"' always;
        # Un add_header dans une location annule TOUS ceux du bloc server : ils sont repris ici.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Points d'entrée d'authentification : rate limitées contre le brute-force.
    location /api/token/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/magic-login/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/activate-account/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Tout ce qui commence par /api va vers le Backend Python
    location /api/ {
        proxy_pass http://backend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SSO Matrix (voir OAUTH2_PROVIDER côté backend, core/oidc.py) : /o/authorize/ est la page
    # de connexion atteinte par le navigateur de l'utilisateur (redirigé depuis Synapse/Element,
    # servis sur des ports dédiés hors WAF, voir doc de conception "Matrix / Element") --
    # rate-limitée comme les autres points d'authentification.
    location /o/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Page de connexion générique (voir /o/ ci-dessus) -- accessible à N'IMPORTE QUEL
    # utilisateur actif, contrairement à /django-admin/login réservé aux is_staff.
    location /accounts/login/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # L'interface d'admin Django
    location /django-admin {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Documents de dossier : jamais servis en direct, uniquement via les actions
    # /api/documents/{id}/download|preview/ qui vérifient les droits d'accès à chaque
    # appel (check_document_access) — contrairement à ce chemin statique qui, lui,
    # ne vérifie rien du tout.
    location /media/documents/ {
        return 403;
    }

    # Photos de crise/offre/demande/information : mêmes raisons — uniquement via les
    # actions /api/.../{id}/preview/ (user_can_view_photo), jamais en accès direct.
    location /media/photos/ {
        return 403;
    }

    # Photos de recherche de personne (fiche + photos de commentaires) : idem.
    location /media/recherches/ {
        return 403;
    }

    location /media/ {
        proxy_pass http://backend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Le reste va vers le Frontend Angular
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Grafana, affiché en iframe dans /admin/monitoring (DOCUMENTATION.md, « Monitoring »).
    # proxy_pass sans chemin : l'URI /grafana/... est transmise telle quelle (serve_from_sub_path).
    # Un add_header dans une location annule ceux du bloc server : ils sont répétés ici, avec
    # SAMEORIGIN au lieu de DENY pour autoriser l'iframe du site lui-même.
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Formulaire de connexion locale de Grafana fermé côté public : la connexion passe par le
    # jeton du backend ; le compte local `admin` ne sert qu'en secours, par tunnel SSH direct
    # sur le port 3000 (sans passer par ce proxy).
    location = /grafana/login { return 403; }
}

# --- Marque blanche Réserve Résilience / Casques Jaunes (voir core/branding.py,
# InstitutionWebDomaine) -- MÊMES conteneurs frontend/backend que le bloc principal
# ci-dessus, c'est tout : seul le Host transmis diffère, c'est lui que le backend utilise pour
# résoudre le branding (logo/couleurs/signature email). app.reserve-resilience.org est pointé
# en CNAME par le partenaire sur cj.assista-crise.fr -- le navigateur envoie le Host
# RÉELLEMENT visité (jamais la cible du CNAME), donc les deux doivent être déclarés comme
# server_name ici, pas seulement cj.assista-crise.fr.
#
# IMPORTANT (hors dépôt, TLS terminé par ac_waf) : ces deux hostnames doivent aussi être
# ajoutés aux SAN du certificat (même processus que matrix./auth./chat. ci-dessous) et à
# l'allowlist server_name du WAF, sans quoi ce bloc ne reçoit jamais de trafic.
server {
    client_max_body_size 20M;
    listen 80;
    server_name cj.assista-crise.fr app.reserve-resilience.org;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/token/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/magic-login/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/activate-account/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://backend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /django-admin {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /media/documents/ { return 403; }
    location /media/photos/ { return 403; }
    location /media/recherches/ { return 403; }

    location /media/ {
        proxy_pass http://backend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# --- Sous-domaines Matrix/Element (.114 uniquement, voir doc de conception "Matrix /
# Element") -- routés par Host via le même WAF/certificat que le domaine principal (SAN
# ajoutées au certificat assista-crise.fr -- mécanique du partage WAF/certificat documentée
# dans proxy/README.md, y compris le piège "--expand" rencontré en ajoutant
# cj.assista-crise.fr), plus besoin de ports dédiés côté .114 contrairement à .113 (pas de
# certificat valide pour son IP LAN, voir bloc :8085 ci-dessous, conservé pour .113 seulement).

# Chaque bloc ci-dessous porte AUSSI son alias de marque blanche (CNAME du partenaire vers le
# sous-domaine assista-crise.fr) : le navigateur envoie le Host RÉELLEMENT visité, jamais la
# cible du CNAME. Le TLS de ces alias est servi par un certificat séparé côté ac_waf (voir
# proxy/waf-partenaires-tls.conf).
server {
    listen 80;
    server_name matrix.assista-crise.fr matrix.reserve-resilience.org;
    client_max_body_size 50M;

    # DÉCOUVERTE CLIENT, SERVIE PAR HÔTE (11/11/2026).
    #
    # Synapse génère /.well-known/matrix/client depuis son `public_baseurl`, qui est UNIQUE :
    # un membre de Réserve Résilience qui saisissait « matrix.reserve-resilience.org » dans
    # Element était aussitôt renvoyé sur « matrix.assista-crise.fr ». Il saisissait son domaine
    # et voyait celui de la plateforme — exactement la fuite de marque qu'on cherche à fermer.
    #
    # On répond donc ici, avant le proxy_pass, avec le Host réellement visité. Zéro risque pour
    # Synapse : rien n'est modifié de son côté, et `$host` ne peut valoir que l'un des deux noms
    # de ce bloc.
    #
    # L'`issuer` reste CELUI DE LA PLATEFORME, et ce n'est pas un oubli : le service
    # d'authentification (MAS) annonce `issuer: https://auth.assista-crise.fr/` en dur dans sa
    # métadonnée OpenID (vérifié le 11/11/2026). Annoncer ici un autre émetteur ferait échouer
    # la validation OIDC chez tout client strict — c'est-à-dire casserait la connexion Matrix
    # pour TOUT LE MONDE, pas seulement pour le partenaire. Le domaine du partenaire sur
    # l'authentification demanderait de reconfigurer l'émetteur de MAS, ce qui invaliderait les
    # sessions existantes.
    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        return 200 '{"m.homeserver":{"base_url":"https://$host/"},"org.matrix.msc2965.authentication":{"issuer":"https://auth.assista-crise.fr/","account":"https://auth.assista-crise.fr/account/"}}';
    }

    location / {
        proxy_pass http://synapse:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name auth.assista-crise.fr auth.reserve-resilience.org;

    location / {
        proxy_pass http://mas:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

}

server {
    listen 80;
    server_name chat.assista-crise.fr chat.reserve-resilience.org;

    location / {
        proxy_pass http://element-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# SSO Matrix en clair, port dédié hors WAF (voir doc de conception "Matrix / Element") --
# le certificat HTTPS du domaine principal (assista-crise.fr) ne correspond pas à l'IP LAN
# 172.16.1.114 (anciennement .113, retirée le 2026-09-28) utilisée par Synapse/Element pour
# joindre cette page depuis un client mobile ;
# un navigateur classique laisse passer outre l'avertissement, mais le navigateur intégré
# qu'utilise Element X pour le flux SSO le refuse silencieusement (écran qui s'ouvre puis ne
# fait plus rien, constaté avec Sylvain le 24/09). Même compromis HTTP-LAN-only que Synapse
# (8008) et Element Web (8082) -- pas de TLS, mais uniquement /o/ et /accounts/login/ exposés
# ici, jamais /api/ ni /django-admin (qui restent exclusivement derrière le WAF/HTTPS).
server {
    listen 8085;
    server_name _;

    location /o/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /accounts/login/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

}

# --- Monitoring : statistiques lues par nginx-exporter. Port 8081 jamais publié ; filtre IP en sécurité.
server {
    listen 8081;
    access_log off;
    location /stub_status {
        stub_status;
        allow 172.16.0.0/12;   # réseaux Docker
        deny all;
    }
}
