# TLS des domaines de marque blanche -- monté dans ac_waf comme
# /etc/nginx/templates/conf.d/partenaires-tls.conf.template (voir docker-compose.114.yml).
#
# Certificat SÉPARÉ de celui d'assista-crise.fr : il porte un autre domaine, émis par HTTP-01
# (voir waf-partenaires-acme.conf). Le certificat principal et son renouvellement DNS-01
# restent inchangés -- c'est tout l'intérêt de ne pas tout mettre dans un seul certificat :
# une erreur ici ne peut pas faire disparaître assista-crise.fr du SAN principal (incident du
# 15/10/2026, voir README).
#
# nginx choisit ce bloc par SNI ; le bloc par défaut de l'image continue de servir
# assista-crise.fr et ses sous-domaines, avec son propre certificat.
#
# ⚠ CE FICHIER RÉFÉRENCE UN CERTIFICAT. Si /etc/letsencrypt/live/reserve-resilience.org/
# n'existe pas, nginx refuse de démarrer et TOUT le site tombe. Il ne doit donc être monté
# qu'APRÈS la première émission -- procédure en deux temps, voir README.
#
# ModSecurity est hérité du niveau http{}, comme pour le bloc par défaut.
server {
    listen 8443 ssl;
    server_name app.reserve-resilience.org auth.reserve-resilience.org
                chat.reserve-resilience.org matrix.reserve-resilience.org;

    ssl_certificate     /etc/letsencrypt/live/reserve-resilience.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reserve-resilience.org/privkey.pem;

    # Mêmes paramètres TLS que le bloc par défaut de l'image, pour ne pas offrir au partenaire
    # un niveau de chiffrement différent de celui du domaine principal.
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_dhparam /etc/ssl/certs/dhparam-2048.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;

    client_max_body_size 0;

    location / {
        include includes/cors.conf;
        include includes/proxy_backend.conf;
    }

    include includes/location_common.conf;
}
