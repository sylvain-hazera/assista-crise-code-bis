# Personnalisations locales du CRS (OWASP Core Rule Set), chargées avant crs-setup.conf et les
# règles CRS elles-mêmes (voir /etc/modsecurity.d/setup.conf sur l'image owasp/modsecurity-crs :
# modsecurity-override.conf est inclus juste après modsecurity.conf).
#
# assista-crise est une API REST (Django REST Framework) qui utilise PATCH/PUT/DELETE sur de
# nombreux endpoints métier (modifier une équipe, un utilisateur, un point opérationnel...) —
# le défaut CRS (règle 900200 dans crs-setup.conf, non actif par défaut) ne laisse passer que
# GET/HEAD/POST/OPTIONS (voir REQUEST-901-INITIALIZATION.conf). Sans cette règle, activer le
# blocage (SecRuleEngine On) casserait toute mise à jour/suppression via l'API — vérifié en
# direct sur les logs d'audit (DetectionOnly) : des PATCH légitimes sur /api/teams/, /api/users/,
# /api/points-operationnels/ déclenchaient la règle 911100 "Method is not allowed by policy".
SecAction \
    "id:900200,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# /o/authorize/ (SSO Matrix, voir core/oidc.py) reçoit un paramètre redirect_uri qui pointe vers
# le service MAS sur son adresse LAN (ex: http://172.16.1.114:8086/upstream/callback/...) --
# la règle CRS 931100 "Possible RFI Attack: URL Parameter using IP Address" bloque tout
# redirect_uri contenant une IP littérale, un faux positif ici (constaté avec Sylvain le
# 24/09 : la vraie connexion échouait en 403 sans autre message). Désactivée seulement sur ce
# chemin précis, le reste du site garde la protection RFI complète.
SecRule REQUEST_URI "@beginsWith /o/authorize" \
    "id:900201,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveById=931100"

# Sous-domaines Matrix (matrix./auth./chat.assista-crise.fr, voir doc de conception
# "Matrix / Element") : le protocole Matrix (payloads JSON riches côté Synapse/sync, MAS
# OAuth) déclenche régulièrement de faux positifs génériques du CRS (ex: règle 930120 "OS
# File Access Attempt" sur le simple nom de paramètre JSON
# json.extensions.org.matrix.msc4262.profiles.enabled, qui contient ".profile" -- constaté
# avec Sylvain le 24/09, bloquait /sync et rendait Element Web inutilisable après chargement
# de la page). Plutôt que d'exclure les règles une par une au fil des faux positifs qui
# continueraient à apparaître, le moteur CRS est désactivé entièrement pour ces 3
# sous-domaines seulement -- Synapse/MAS ont leur propre validation stricte des entrées, ce
# n'est pas une app web classique que le CRS est conçu pour protéger. Le site principal
# (assista-crise.fr) garde la protection CRS complète.
#
# 15/11/2026 : mêmes sous-domaines chez le partenaire (matrix./auth./chat.reserve-resilience.org,
# servis par les mêmes Synapse, MAS et Element depuis le 22/10). Ils n'étaient pas couverts : le
# même faux positif les attendait au premier /sync un peu riche.
SecRule REQUEST_HEADERS:Host "@rx ^(matrix|auth|chat)\.(assista-crise\.fr|reserve-resilience\.org)(?::\d+)?$" \
    "id:900202,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleEngine=Off"

# En-têtes interdits (règle 920450) : liste par défaut du CRS MOINS accept-charset. Des
# navigateurs mobiles réels (iPhone, Android) l'envoient sur la simple page d'accueil -- relevé
# dans les journaux DetectionOnly (24/09 et 15/10) en préparant le passage en mode blocage le
# 19/10 : il les aurait bloqués. Les autres en-têtes dangereux (proxy/httpoxy, content-encoding,
# lock-token, content-range, if) restent interdits.
SecAction \
    "id:900250,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.restricted_headers=/content-encoding/ /proxy/ /lock-token/ /content-range/ /if/'"

# Grafana (page admin Monitoring, /grafana/) : ses requêtes PromQL (`or vector(0)`, `[5m]`,
# accolades...) déclenchent les règles d'injection SQL/générique -- vérifié en mode blocage le
# 19/10, tableau de bord inutilisable. CRS désactivé sur ce seul chemin : Grafana n'accepte que
# les jetons signés par le backend pour un administrateur (core/grafana.py, vérifiés avec la clé
# publique) et son formulaire de connexion locale est fermé côté public (proxy/nginx.conf).
SecRule REQUEST_URI "@beginsWith /grafana/" \
    "id:900203,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleEngine=Off"

# Envois de LISTES par les ponts radio (15/11/2026). Le pont MeshCore envoie d'un coup tous les
# contacts de sa radio. Au-delà de mille valeurs JSON (SecArgumentsLimit), ModSecurity abandonne
# la lecture du corps et refuse la requête en 400 : règle 200007 (« Failed to fully parse request
# body due to large argument count »), puis 200002 et 920130 si on retire la première. Relevé
# dans le journal d'audit : 680 refus du 24/10 au 13/11 sur
# /api/compagnons-meshcore/<id>/synchroniser-contacts/ -- la liste des contacts de ce compagnon
# n'était donc plus jamais mise à jour.
#
# Sur les trois chemins où un pont envoie une liste entière, ModSecurity ne lit plus le CORPS
# (l'adresse, les en-têtes et les paramètres restent contrôlés). Ce qu'on y perd est mince :
# ces chemins exigent un compte de pont, Django refuse tout autre appelant avant de lire le
# corps, et le sérialiseur valide chaque champ. Relever la limite pour tout le site aurait au
# contraire affaibli la protection de tous les formulaires.
SecRule REQUEST_URI "@rx ^/api/compagnons-mesh(?:core|tastic)/[0-9a-f-]{36}/(?:synchroniser-contacts|rapporter-liaisons|signaler-canaux-detectes)/$" \
    "id:900204,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:requestBodyAccess=Off"

# Site utilisé par son adresse sur le réseau local (https://172.16.1.114 : téléphones, postes,
# supervision). La règle 920350 (« Host header is a numeric IP address ») ajoutait 3 points à
# chacune de ces requêtes : un rien de plus et elle était refusée (seuil 5). Depuis le 15/11
# une connexion par adresse venue d'Internet est coupée avant ModSecurity (waf-porte-fermee.conf) :
# cette règle ne voit plus que le réseau local, où elle ne fait que des faux positifs.
SecRule REQUEST_HEADERS:Host "@rx ^172\.16\.1\.114(?::\d+)?$" \
    "id:900205,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveById=920350"
