# Configuration de DÉVELOPPEMENT (montée par docker-compose.override.yml). Mêmes routes que
# nginx.conf — à garder synchronisées — sans ce qui n'existe que sur le serveur (logs
# /var/log/nginx-real, IP réelle derrière le WAF, upstreams Matrix).

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_status 429;

# Le jeton Grafana (?auth_token=, voir location /grafana/) ne doit pas finir dans les journaux,
# ni dans l'URL demandée ni dans le Referer des requêtes envoyées depuis l'iframe.
map $request $request_masque {
    "~^(?<avant>.*[?&]auth_token=)[^& ]+(?<apres>.*)$" "${avant}MASQUE${apres}";
    default $request;
}
map $http_referer $referer_masque {
    "~^(?<avant>.*[?&]auth_token=)[^&]+(?<apres>.*)$" "${avant}MASQUE${apres}";
    default $http_referer;
}
log_format masque '$remote_addr - $remote_user [$time_local] "$request_masque" '
                  '$status $body_bytes_sent "$referer_masque" "$http_user_agent"';
# Grafana résolu à chaque requête : nginx démarre même sans le profil monitoring (voir nginx.conf)
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    client_max_body_size 20M;
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access.log masque;   # remplace le journal hérité, non masqué
    set $grafana http://grafana:3000;

    # Points d'authentification : limités contre le brute-force
    location ~ ^/(api/token|api/magic-login|api/activate-account|o|accounts/login)/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /django-admin {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Grafana en iframe dans /admin/monitoring ; URI transmise telle quelle (serve_from_sub_path)
    location = /grafana { return 301 /grafana/; }

    location /grafana/ {
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Connexion locale de Grafana : limitée contre le brute-force (pas le reste de /grafana/)
    location = /grafana/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass $grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers privés : uniquement via les actions d'API qui vérifient les droits
    location /media/documents/  { return 403; }
    location /media/photos/     { return 403; }
    location /media/recherches/ { return 403; }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serveur de dev Angular (ng serve), WebSocket pour le rechargement à chaud
    location / {
        proxy_pass http://frontend:4200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

# Statistiques pour nginx-exporter (port jamais publié)
server {
    listen 8081;
    access_log off;
    location /stub_status {
        stub_status;
        allow 172.16.0.0/12;
        deny all;
    }
}
