# Pipeline : test (chaque push) -> build (branche prod) -> deploy (branche prod).
# Variables CI requises : voir DOCUMENTATION.md, « CI/CD ».
stages:
  - test
  - build
  - deploy

variables:
  REGISTRY: $HARBOR_URL/$HARBOR_PROJECT

# ============================================================== test
monitoring_rules:
  stage: test
  image: { name: prom/prometheus:v3.15.0, entrypoint: [""] }
  script:
    - promtool check config monitoring/prometheus/prometheus.yml
    - cd monitoring/prometheus && promtool test rules alerts_test.yml   # unit tests of the alerting rules

alertmanager_config:
  stage: test
  image: { name: prom/alertmanager:v0.34.0, entrypoint: [""] }
  script:
    - amtool check-config monitoring/alertmanager/alertmanager.yml monitoring/alertmanager/alertmanager.prod.yml

compose_config:
  stage: test
  image: docker:29.9.0
  script:
    - docker compose config -q
    - docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile monitoring config -q

backend_tests:
  stage: test
  image: python:3.10-slim
  services:
    - name: postgis/postgis:15-3.3
      alias: db
  variables:
    POSTGRES_DB: assista-db
    POSTGRES_USER: admin
    POSTGRES_PASSWORD: ci-only-password       # throwaway database of this job only
    DB_USER: admin
    DB_PASS: ci-only-password
    SECRET_KEY: ci-only-not-a-secret
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends binutils libproj-dev gdal-bin libgdal-dev gcc > /dev/null
    - pip install -q -r backend/requirements.txt
  script:
    - cd backend && pytest -q -p no:cacheprovider --no-cov
  # TODO : à retirer quand la suite sera verte (tests déjà en échec sur main)
  allow_failure: true

# ============================================================== build
build_push_harbor:
  stage: build
  image: docker:29.9.0
  services: [docker:dind]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
  before_script:
    - echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USER" --password-stdin "$HARBOR_URL"
  script:
    # deux tags : le commit (traçabilité, rollback) et latest
    - docker build -t $REGISTRY/backend:$CI_COMMIT_SHORT_SHA -t $REGISTRY/backend:latest ./backend
    - docker build -f frontend/Dockerfile.prod -t $REGISTRY/frontend:$CI_COMMIT_SHORT_SHA -t $REGISTRY/frontend:latest ./frontend
    - docker build -t $REGISTRY/proxy:$CI_COMMIT_SHORT_SHA -t $REGISTRY/proxy:latest ./proxy
    # smoke test de l'image elle-même : Django démarre avec ses vraies dépendances
    - docker run --rm --entrypoint python -e SECRET_KEY=smoke-test -e DB_USER=smoke -e DB_PASS=smoke $REGISTRY/backend:$CI_COMMIT_SHORT_SHA manage.py check
    - docker push --all-tags $REGISTRY/backend
    - docker push --all-tags $REGISTRY/frontend
    - docker push --all-tags $REGISTRY/proxy
    # images de monitoring : leur Dockerfile revalide la configuration (promtool / amtool)
    - |
      for svc in prometheus alertmanager grafana; do
        docker build -t $REGISTRY/$svc:$CI_COMMIT_SHORT_SHA -t $REGISTRY/$svc:latest ./monitoring/$svc
        docker push --all-tags $REGISTRY/$svc
      done

# ============================================================== deploy
deploy_vm:
  stage: deploy
  image: alpine:3.18
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    # empreinte de la VM vérifiée une fois à la main (protection contre l'homme du milieu)
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - export REMOTE_DIR="/home/$SSH_USER/assista-crise"
    - export SSH="ssh -i $HOME/.ssh/id_ed25519 $SSH_USER@$SSH_HOST"
    - export SCP="scp -i $HOME/.ssh/id_ed25519"
    - export COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile monitoring"
    # .env et secrets sont préparés une fois sur la VM, jamais envoyés par la CI
    - $SCP -r docker-compose.yml docker-compose.prod.yml monitoring scripts $SSH_USER@$SSH_HOST:$REMOTE_DIR/
    - $SCP mosquitto/config/mosquitto.conf $SSH_USER@$SSH_HOST:$REMOTE_DIR/mosquitto/config/mosquitto.conf
    # mot de passe via stdin, jamais en argument (visible dans la liste des processus)
    - echo "$HARBOR_PASSWORD" | $SSH "docker login -u '$HARBOR_USER' --password-stdin '$HARBOR_URL'"
    # sans --force-recreate : seuls les conteneurs modifiés sont recréés
    - $SSH "cd $REMOTE_DIR && export IMAGE_TAG=$CI_COMMIT_SHORT_SHA && $COMPOSE pull && $COMPOSE up -d --remove-orphans && docker image prune -f"
