# Alertmanager de PRODUCTION, intégré à l'image : aucun secret ici (mot de passe SMTP et URL
# healthchecks.io sont lus dans /run/secrets). TODO avant le build : l'adresse de l'équipe.
global:
  smtp_smarthost: 'smtp.ionos.fr:465'          # 465 = TLS implicite
  smtp_from: 'no-reply@assista-crise.fr'
  smtp_auth_username: 'no-reply@assista-crise.fr'
  smtp_auth_password_file: '/run/secrets/email_password'

route:
  receiver: team-email
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h      # avertissements : un rappel par jour, pas plus (demande du 20/10)
  routes:
    # battement renvoyé chaque minute (sinon répétition par défaut de 4 h = fausse alerte)
    - matchers: ['alertname="Watchdog"']
      receiver: deadmans-switch
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers: ['severity="critical"']
      receiver: team-email
      repeat_interval: 4h     # critiques (site, base...) : rappel toutes les 4 h

receivers:
  - name: team-email
    email_configs:
      # Jamais d'adresse réelle dans le dépôt. .114 monte sa propre copie de ce fichier, avec les
      # destinataires : ~/.config/assista-crise/monitoring/alertmanager.114.yml (docker-compose.114.yml).
      - to: 'TODO-team-address@example.org'
        send_resolved: true
  # Dead man's switch, câblé sur .114 le 06/11/2026. L'alerte Watchdog est toujours active (voir
  # monitoring/prometheus/alerts.yml, groupe « meta ») et la route ci-dessus la renvoie ici chaque
  # minute. healthchecks.io ne sert donc à rien tant que tout va bien : il alerte quand le
  # battement S'ARRÊTE. C'est le seul mécanisme capable de signaler l'arrêt de Prometheus lui-même,
  # puisqu'aucune alerte interne ne peut être évaluée par un Prometheus absent -- c'est ce trou qui
  # a laissé ac_prometheus à terre du 03/11 au 05/11/2026 sans que rien ne le signale.
  # send_resolved: false -- Watchdog ne se résout jamais, un ping « resolved » n'aurait aucun sens.
  # L'URL de ping est un secret (qui la connaît peut envoyer de faux battements) : elle est lue
  # dans /run/secrets, jamais écrite ici.
  - name: deadmans-switch
    webhook_configs:
      - url_file: '/run/secrets/healthchecks_url'
        send_resolved: false

inhibit_rules:
  - source_matchers: ['alertname="SiteDown"']   # site tombé : les warnings ne sont que des conséquences
    target_matchers: ['severity="warning"']
    equal: ['environment']
