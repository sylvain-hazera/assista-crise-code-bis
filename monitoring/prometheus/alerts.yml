# Règles d'alerte, testées par alerts_test.yml (principes : DOCUMENTATION.md, « Monitoring »).

groups:
  # ------------------------------------------------------------------ availability
  - name: availability
    rules:
      - alert: SiteDown
        expr: probe_success{job="blackbox-https"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is unreachable"
          description: "The external HTTPS probe of {{ $labels.instance }} has failed for 2 minutes: users cannot reach the site."

      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} for more than 2 minutes."

      # up == 1 dit seulement que l'EXPORTER répond : chacun publie aussi l'état de son service.
      - alert: ServiceDown
        expr: (nginx_up == 0) or (pg_up == 0)
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }}: the exporter is up but reports its service DOWN"
          description: "The {{ $labels.job }} exporter answers, but cannot reach the service it monitors."

  # ------------------------------------------------------------------ application
  - name: application
    rules:
      - alert: HighErrorRate
        # seuil de trafic : 1 erreur sur 2 requêtes n'est pas un incident
        expr: |
          (
            sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m]))
              / sum(rate(django_http_responses_total_by_status_total[5m]))
          ) > 0.05
          and sum(rate(django_http_responses_total_by_status_total[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "API error rate is {{ $value | humanizePercentage }}"
          description: "More than 5% of API responses are 5xx over the last 5 minutes."

      - alert: SlowAPI
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(django_http_requests_latency_seconds_by_view_method_bucket{view!="prometheus-django-metrics"}[5m]))
          ) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "API p95 latency is {{ $value | humanizeDuration }}"
          description: "5% of API requests take more than 1 second, for 10 minutes."

      - alert: EmailsFailing
        expr: sum by (kind) (increase(assista_emails_failed_total[15m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "Emails of type {{ $labels.kind }} are failing"
          description: "At least one email could not be sent in the last 15 minutes. Check the backend logs (logger.exception) and the SMTP settings."

      # Per-account sign-in brake (core/frein_connexion.py). One person mistyping a password
      # triggers it 4 or 5 times at most in 15 minutes, because each new failure doubles the
      # wait. More than 10 means several accounts or several devices are being hammered.
      - alert: SignInBruteForce
        expr: sum(increase(assista_connexions_freinees_total[15m])) > 10
        labels: { severity: warning }
        annotations:
          summary: "Sign-in attempts are being slowed down on several accounts"
          description: "More than 10 failed sign-ins hit the per-account brake in 15 minutes. Look at the Fail2ban page (jail connexion-ratee) and at the audit trail."

      # Sign-up anti-robot check (core/defi_inscription.py). Only what a person's browser
      # never produces is counted: a forged or replayed challenge, no challenge at all beyond
      # the legacy quota, the per-address ceiling. A real surge of sign-ups (accepted, or asked
      # for a harder challenge) does not fire: that is a crisis, not an attack.
      - alert: SignUpRobots
        expr: sum(increase(assista_inscriptions_total{resultat=~"defi_invalide|defi_rejoue|defi_requis|plafond"}[15m])) > 20
        labels: { severity: warning }
        annotations:
          summary: "Robots are trying to create accounts"
          description: "More than 20 sign-up requests were refused by the anti-robot check in 15 minutes. To make the check harder for everyone for a while: docker exec ac_backend python manage.py durcir_inscription FORT --heures 2"

  # ------------------------------------------------------------------ infrastructure
  - name: infrastructure
    rules:
      - alert: DiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat"}[6h], 24 * 3600) < 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} will be full within 24 hours"
          description: "At the current rate, {{ $labels.mountpoint }} on {{ $labels.instance }} runs out of space within a day."

      - alert: DiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|vfat"} < 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} has less than 5% free space"
          description: "Databases and logs fail when the disk is full. Free space now."

      - alert: LowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Less than 10% memory available on {{ $labels.instance }}"
          description: "The host may start killing processes (OOM). Check which container uses the memory in Grafana."

      - alert: HighLoad
        expr: node_load15 / on(instance) count by (instance) (node_cpu_seconds_total{mode="idle"}) > 1.5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Load on {{ $labels.instance }} is {{ $value | printf \"%.1f\" }} times its CPU count"
          description: "The machine has more work than processors for 15 minutes: everything slows down. Look for the container using the CPU in Grafana (Infrastructure)."

      - alert: HostOutOfMemoryKill
        expr: increase(node_vmstat_oom_kill[15m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "The kernel killed a process for lack of memory on {{ $labels.instance }}"
          description: "A process (often a container) was killed by the out-of-memory killer in the last 15 minutes. Find it: journalctl -k | grep -i 'killed process'."

      - alert: InodesAlmostFull
        expr: |
          node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|vfat"}
            / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs|vfat"} < 0.05
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} has less than 5% free inodes"
          description: "No new file can be created when inodes run out, even with free space left. Usually millions of small files: old Docker layers or logs."

      - alert: FilesystemReadOnly
        expr: node_filesystem_readonly{fstype!~"tmpfs|overlay|squashfs|vfat|iso9660"} == 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} is mounted read-only"
          description: "The kernel remounts a disk read-only after an I/O error. The database can no longer write. Check dmesg and the disk health now."

      - alert: ClockNotSynchronised
        expr: node_timex_sync_status == 0 or abs(node_timex_offset_seconds) > 2
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "The clock of {{ $labels.instance }} is not synchronised"
          description: "Sign-in tokens, TLS, signed satellite updates and radio timestamps all depend on the clock. Check: timedatectl status."

      - alert: HostRebooted
        expr: time() - node_boot_time_seconds < 600
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} restarted less than 10 minutes ago"
          description: "If nobody restarted it on purpose: power cut, kernel panic or automatic update. Check that every container came back (docker ps)."

      - alert: HighTemperature
        expr: max by (instance) (node_hwmon_temp_celsius) > 90
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} is at {{ $value | printf \"%.0f\" }} °C"
          description: "Above 90 °C for 15 minutes the processor slows itself down and hardware ages fast. Check the fan and the room."

      # --- containers -------------------------------------------------------------------------
      # 18/11/2026: cAdvisor 0.49 could not read containers after the move to Docker 29 (image
      # store in containerd). Every series lost its `name`, so ContainerRestarting below could
      # not fire, silently, for weeks. This rule is the alarm on the alarm.
      - alert: ContainerMetricsBlind
        expr: absent(container_last_seen{name=~"ac_.+"})
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "The container probe no longer sees any container"
          description: "cAdvisor answers but names no container: every container alert is blind. Check: docker logs ac_cadvisor (an incompatibility after a Docker upgrade is the usual cause)."

      # « Was there during the last 6 hours, is not there now » : names the container, and
      # needs no list to maintain. `for: 5m` lets a redeployment recreate it in peace.
      - alert: ContainerDown
        expr: |
          group by (name) (last_over_time(container_last_seen{name=~"ac_.+", name!="ac_mig_db", name!~"ac_test_.+"}[6h]))
            unless group by (name) (container_last_seen{name=~"ac_.+"})
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Container {{ $labels.name }} is no longer running"
          description: "It was running in the last 6 hours and has been gone for 5 minutes. Check: docker ps -a --filter name={{ $labels.name }} then docker logs {{ $labels.name }}."

      - alert: ContainerOutOfMemoryKill
        expr: increase(container_oom_events_total{name=~"ac_.+"}[15m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "Container {{ $labels.name }} was killed for lack of memory"
          description: "It hit its memory limit, or the machine ran out. It restarts, but what it was doing is lost."

      - alert: ContainerMemoryNearLimit
        expr: |
          container_memory_working_set_bytes{name=~"ac_.+"}
            / (container_spec_memory_limit_bytes{name=~"ac_.+"} > 0) > 0.9
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Container {{ $labels.name }} uses {{ $value | humanizePercentage }} of its memory limit"
          description: "It will be killed when it reaches the limit."

      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 2
        labels: { severity: warning }
        annotations:
          summary: "Container {{ $labels.name }} restarted {{ $value }} times in 15 minutes"
          description: "Probably a crash loop: check docker logs {{ $labels.name }}."

      - alert: DatabaseDeadlocks
        expr: sum(increase(pg_stat_database_deadlocks[15m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "PostgreSQL had to break a deadlock in the last 15 minutes"
          description: "Two operations blocked each other and one was cancelled: somebody got an error. Details: docker logs ac_db | grep -i deadlock."

      - alert: DatabaseLongTransaction
        expr: max(pg_stat_activity_max_tx_duration{state=~"active|idle in transaction"}) > 900
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "A database transaction has been open for {{ $value | humanizeDuration }}"
          description: "A transaction open for more than 15 minutes holds locks and blocks maintenance. Often a forgotten shell or a stuck job."

      - alert: DatabaseConnectionsHigh
        expr: sum(pg_stat_activity_count) / scalar(max(pg_settings_max_connections)) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "PostgreSQL uses {{ $value | humanizePercentage }} of its connections"
          description: "New connections will be refused when the limit is reached."

  # ------------------------------------------------------------------ certificates
  - name: certificates
    rules:
      - alert: TLSCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "TLS certificate of {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"
          description: "Automatic renewal has probably failed. Check certbot on the VM."

      - alert: TLSCertExpiringCritical
        expr: probe_ssl_earliest_cert_expiry - time() < 3 * 86400
        for: 1h
        labels: { severity: critical }
        annotations:
          summary: "TLS certificate of {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"
          description: "Browsers will block the site when it expires. Renew it now."

  # ------------------------------------------------------------------ business (the mission)
  - name: business
    rules:
      - alert: NoHelpRequestDuringActiveCrisis
        # or vector(0) : aucune demande doit compter comme 0, pas comme « pas de donnée »
        expr: |
          (sum(assista_active_crises{environment="PROD"}) > 0)
          and on() ((sum(increase(assista_help_requests_total{environment="PROD"}[6h])) or vector(0)) == 0)
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "A crisis is active but no help request was created for 6 hours"
          description: "Either nobody needs help, or the request form is broken. Test it on the public site."

      - alert: UnprocessedRequestsPilingUp
        expr: sum(assista_requests_by_status{status="NON_TRAITEE", environment="PROD"}) > 50
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} help requests are waiting to be processed"
          description: "Requests are arriving faster than teams process them."

      # Un email part déjà à chaque nouveau compte en attente : celle-ci rattrape l'oubli.
      - alert: AccountWaitingForValidation
        expr: assista_oldest_pending_account_age_seconds > 24 * 3600
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "An account has been waiting for validation for {{ $value | humanizeDuration }}"
          description: "Validate or reject it on /admin/validations-comptes."


  # ------------------------------------------------------------------ réseau radio (mesh)
  # Transposition des alertes de carte-live-meshtastic : elles y sont calculées et affichées par
  # leur propre serveur, ici elles passent par Prometheus et Grafana -- « un seul Grafana ».
  # Aucune étiquette ne nomme un nœud : une étiquette finit dans un fichier de métriques non
  # chiffré, alors que ContactMeshCore.nom est chiffré en base (voir core/metrics.py).
  - name: mesh
    rules:
      - alert: MeshCompagnonSilencieux
        # 2 h : les companions rapportent leur état régulièrement ; au-delà, la passerelle est
        # muette et le réseau radio n'est plus relayé vers la plateforme.
        expr: assista_mesh_compagnon_silence_max_secondes > 2 * 3600
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "A mesh companion has been silent for {{ $value | humanizeDuration }}"
          description: "Check the gateway and its radio on /admin/meshcore-companions."

      - alert: MeshPlusAucunCompagnon
        # Plus aucune passerelle active : la plateforme est coupée du réseau radio. Critique --
        # c'est le moyen de communication de repli quand le reste tombe.
        expr: sum(assista_mesh_compagnons_actifs) == 0
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "No active mesh companion left"
          description: "The platform is cut off from the radio network: no companion is active."

      - alert: MeshInfrastructureBatterieFaible
        # Un répéteur sous 20 % est souvent sur un point haut difficile d'accès : prévenir tôt
        # laisse le temps d'organiser une intervention. Seuil aligné sur le leur.
        expr: sum(assista_mesh_infrastructure_batterie_faible) > 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} heard repeater(s) below 20% battery"
          description: "See /admin/meshcore-companions; a repeater on a mast takes time to reach."

      - alert: MeshTachesAdminEnEchec
        # Une tache d'administration abandonnee apres ses reessais signale presque toujours la
        # meme chose : la cle publique de la passerelle n'est pas autorisee sur le noeud cible
        # (security.admin_key), ou le noeud ne repond plus. 30 min laissent passer les reessais
        # normaux -- une tache traverse la radio, elle a le droit d'echouer une fois.
        expr: sum(assista_mesh_taches_admin{statut="ECHEC"}) > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} Meshtastic admin task(s) abandoned after retries"
          description: "See /admin/meshtastic-administration: usually the gateway public key is not in the target node's security.admin_key."


  # ------------------------------------------------------------------ sauvegardes
  # Mesurées par scripts/114/mesurer-sauvegardes.sh (cron, fichier lu par node-exporter). Une
  # sauvegarde qui s'arrête ne fait aucun bruit : c'est le jour où l'on en a besoin qu'on le
  # découvre.
  - name: backups
    rules:
      - alert: BackupMetricsMissing
        expr: absent(assista_sauvegarde_age_secondes)
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Backups are not being measured"
          description: "scripts/114/mesurer-sauvegardes.sh is not running (cron), or node-exporter does not read its file: nobody would notice a backup that stops."

      - alert: BackupDatabaseTooOld
        expr: assista_sauvegarde_age_secondes{type="base"} > 26 * 3600
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "The last database backup is {{ $value | humanizeDuration }} old"
          description: "The nightly dump (03:00) did not produce a file. Check ~/backups/assista-db/backup.log."

      - alert: BackupDatabaseTooSmall
        expr: assista_sauvegarde_octets{type="base"} < 1e6
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "The last database backup is only {{ $value | humanize1024 }}B"
          description: "A dump this small is empty or truncated: it would not restore anything."

      - alert: BackupContinuousTooOld
        expr: assista_sauvegarde_age_secondes{type=~"media|wal"} > 3 * 3600
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "The {{ $labels.type }} backup has not succeeded for {{ $value | humanizeDuration }}"
          description: "It runs every 15 minutes. Check ~/scripts/backup-snapshot.log."

      - alert: DockerBuildCacheHuge
        expr: assista_docker_cache_construction_octets > 40e9
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Docker build cache uses {{ $value | humanize1024 }}B"
          description: "It filled the disk to 95% on 17/11/2026. Free it: docker builder prune -f --filter until=72h"

  # ------------------------------------------------------------------ satellites
  # Counted, never named: a label ends up in an unencrypted metrics file.
  - name: satellites
    rules:
      - alert: SatelliteLost
        expr: sum by (environment) (assista_satellites{etat="PERDU"}) > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} satellite(s) have stopped calling the central"
          description: "An approved satellite has been silent past the 'lost' threshold: power, network, or a crashed machine. See the Satellites page."

      - alert: SatelliteUpdateFailed
        expr: sum by (environment) (assista_satellites_mise_a_jour_echouee) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} satellite(s) are left on a failed update"
          description: "Their last update failed and nothing succeeded since: the local server may be down. On the Satellites page, ask for 'Bilan complet' and read the journal."

      - alert: SatelliteOrderStuck
        expr: max by (environment) (assista_satellites_ordre_en_attente_secondes) > 3600
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "An order to a satellite has been waiting for {{ $value | humanizeDuration }}"
          description: "The agent of that satellite did not take or finish it: agent stopped, machine off, or reports refused by the firewall."

  # ------------------------------------------------------------------ meta-monitoring
  - name: meta
    rules:
      - alert: PrometheusRuleFailures
        expr: increase(prometheus_rule_evaluation_failures_total[15m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "Prometheus cannot evaluate some alert rules"
          description: "A rule that fails to evaluate never fires: part of the alerting is blind. Check: docker logs ac_prometheus."

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0 or alertmanager_config_last_reload_successful == 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} is running on an old configuration"
          description: "Its last configuration reload failed: recent changes to rules or routes are not applied."

      - alert: AlertNotificationsFailing
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total[30m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "Alert notifications by {{ $labels.integration }} are failing"
          description: "Alerts fire but do not reach anybody. Check: docker logs ac_alertmanager."

      - alert: SiteSlow
        expr: probe_duration_seconds{job="blackbox-https"} > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} takes {{ $value | printf \"%.1f\" }} s to answer"
          description: "The home page takes more than 5 seconds for 10 minutes, as a visitor would see it."

      # Dead man's switch : toujours active, alerte quand le battement S'ARRÊTE (healthchecks.io).
      - alert: Watchdog
        expr: vector(1)
        labels: { severity: none }
        annotations:
          summary: "Heartbeat: the alerting pipeline is alive. This alert must ALWAYS be firing."

  # ---- Veille du territoire : sources ouvertes copiées en base (15/11/2026) ----
  # Vigilance Météo-France, événements routiers, stations de carburant (core/sources_ouvertes.py).
  # Le seuil de péremption est décidé par l'application, source par source : une seule règle
  # couvre toutes les sources, présentes et à venir.
  - name: veille
    rules:
      - alert: SourceOuvertePerimee
        # 20 min de marge : un relevé manqué n'est pas une panne, deux de suite commencent à
        # l'être. Sans cette alerte, une vigilance qui cesse d'arriver ne se verrait pas -- les
        # écrans continueraient d'afficher la dernière connue.
        expr: assista_source_ouverte_perimee == 1
        for: 20m
        labels: { severity: warning }
        annotations:
          summary: "Open-data source {{ $labels.source }} is no longer refreshing"
          description: "Check the cron job (relever-sources-ouvertes.sh) and its log, then run: manage.py relever_sources_ouvertes --source {{ $labels.source }} --forcer"

      - alert: CleMeteoFranceExpireBientot
        # La clé du portail Météo-France a une durée de vie (trois ans au plus). Un mois de
        # préavis : la renouveler demande de se connecter au portail avec le compte du porteur.
        expr: assista_meteofrance_cle_jours_restants < 30
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "The Meteo-France API key expires in {{ $value | printf \"%.0f\" }} days"
          description: "Generate a new key on portail-api.meteofrance.fr and replace the meteofrance_cle_api secret."
