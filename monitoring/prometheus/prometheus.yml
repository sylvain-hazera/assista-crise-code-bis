global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: ${ENVIRONMENT}      # dev / prod, fourni par la couche compose

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # --- la pile de monitoring elle-même
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]

  - job_name: alertmanager
    static_configs: [{ targets: ['alertmanager:9093'] }]

  # --- application
  - job_name: django
    static_configs: [{ targets: ['backend:8000'] }]

  # --- services, via leurs exporters
  - job_name: postgres
    static_configs: [{ targets: ['postgres-exporter:9187'] }]

  - job_name: nginx
    static_configs: [{ targets: ['nginx-exporter:9113'] }]

  - job_name: mosquitto
    static_configs: [{ targets: ['mosquitto-exporter:9234'] }]

  # --- hôte et conteneurs
  - job_name: node
    static_configs: [{ targets: ['node-exporter:9100'] }]

  - job_name: cadvisor
    static_configs: [{ targets: ['cadvisor:8080'] }]

  # --- boîte noire : le site public, vu comme un utilisateur
  - job_name: blackbox-https
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs: [{ targets: ['https://assista-crise.fr'] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: 'blackbox-exporter:9115' }
