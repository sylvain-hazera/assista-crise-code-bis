# Loki (.114) : journaux du WAF et de fail2ban, collectés par Alloy (monitoring/alloy/config.alloy),
# consultés dans Grafana (pages admin Supervision WAF / Fail2ban). Instance unique, stockage disque.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore: { store: inmemory }
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: { prefix: index_, period: 24h }

limits_config:
  retention_period: 90d
  # Au premier démarrage, Alloy relit les journaux depuis leur début (audit WAF depuis le
  # 03/09/2026) : ces lignes anciennes doivent être acceptées.
  reject_old_samples: false
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_length: 91d          # tableaux de bord sur toute la rétention

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
