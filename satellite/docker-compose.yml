# Docker + docker-compose sur Raspberry Pi OS standard — décision du 2026-09-17, PAS une image
# disque pré-construite (voir le cadrage "Chantier B" : réutilise directement les images déjà
# éprouvées du reste du projet, aucune nouvelle chaîne de fabrication d'image à maintenir).
#
# Deux profils :
#   gw   : pont + proxy MeshCore + détecteur de connectivité — le minimum pour relayer la radio
#          vers le central (ou un satellite Full local, si les deux Pi coexistent sur le site).
#   full : gw + assista-crise complet (backend/frontend/db) + serveur de tuiles offline —
#          utilisable même sans internet.
#
# Usage : cp .env.example .env, compléter, puis `docker compose --profile gw up -d` (ou
# `--profile full`).
#
# meshtastic-bridge (ajouté le 2026-09-17) gère PLUSIEURS CompagnonMeshtastic à la fois, chacun
# avec son propre connexion_type (MQTT/TCP/SERIE) stocké côté Django, pas dans ce fichier — le
# conteneur n'a besoin que des identifiants du compte de service, il découvre le reste via
# l'API. Le device série passé ici (MESHTASTIC_SERIE_DEVICE) doit correspondre exactement au
# `serie_device` renseigné sur le CompagnonMeshtastic concerné côté Django, sinon Docker ne
# passera pas le bon périphérique au conteneur. Non testé sur du vrai matériel série à ce jour
# (voir meshtastic-bridge/README.md) — le mode TCP, lui, est validé en conditions réelles.

services:

  # Outil d'installation, PAS un service qui tourne en continu — à lancer une fois à
  # l'installation (ou après un changement de matériel) avec :
  #   docker compose --profile outillage run --rm detecter-noeud
  # /dev entier monté (plutôt qu'un device précis) : le but est justement de trouver LEQUEL
  # brancher avant de le savoir — accès large temporaire, le temps de cette seule commande, pas
  # celui des services qui tournent en continu (meshcore-proxy/meshtastic-bridge, eux, ne
  # montent que le device déjà identifié). Écrit le résultat dans le volume `etat_satellite`,
  # relu par le reste (voir detecter_noeud_serie.py :FICHIER_ETAT_NOEUD_SERIE).
  detecter-noeud:
    build:
      context: .
      dockerfile: Dockerfile.detection
    volumes:
      - /dev:/dev
      - etat_satellite:/var/run/satellite
    environment:
      - CENTRAL_URL=${CENTRAL_URL:-https://assista-crise.fr}
      - SATELLITE_EMAIL=${SATELLITE_EMAIL}
      - SATELLITE_PASSWORD=${SATELLITE_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    privileged: true
    profiles: ["outillage"]

  # --- Commun aux deux profils ---

  meshcore-proxy:
    build:
      context: ../meshcore-bridge
    command: ["python", "-u", "proxy.py"]
    # --network host, pas un réseau Docker isolé : requis pour que l'annonce mDNS
    # (_meshcore._tcp.local., voir meshcore-bridge/proxy.py) porte une IP réellement joignable
    # sur le LAN — vérifié en conditions réelles sur .113 le 2026-09-17 (voir
    # meshcore-bridge/README.md). Sur un satellite dédié (pas de conflit de port avec d'autres
    # services), ça ne coûte rien contrairement à .113.
    network_mode: host
    environment:
      - MESHCORE_CONNEXION_TYPE=${MESHCORE_CONNEXION_TYPE:-SERIE}
      - MESHCORE_TCP_HOST=${MESHCORE_TCP_HOST:-}
      - MESHCORE_TCP_PORT=${MESHCORE_TCP_PORT:-5000}
      - MESHCORE_SERIE_DEVICE=${MESHCORE_SERIE_DEVICE:-/dev/ttyUSB0}
      - PROXY_LISTEN_PORT=${MESHCORE_PROXY_PORT:-5050}
      - PROXY_MDNS_NOM=${SATELLITE_NOM:-satellite-assista-crise}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    devices:
      - "${MESHCORE_SERIE_DEVICE:-/dev/ttyUSB0}:${MESHCORE_SERIE_DEVICE:-/dev/ttyUSB0}"
    restart: unless-stopped
    profiles: ["gw", "full"]

  meshcore-bridge:
    build:
      context: ../meshcore-bridge
    command: ["python", "-u", "bridge.py"]
    # Rejoint le proxy via 127.0.0.1 (même network_mode: host) — voir la même logique que
    # .113/ac_meshcore_bridge -> ac_meshcore_proxy, en plus simple ici (pas de réseau Docker
    # séparé à faire communiquer, un satellite est mono-usage).
    network_mode: host
    environment:
      - MESHCORE_CONNEXION_TYPE=TCP
      - MESHCORE_TCP_HOST=127.0.0.1
      - MESHCORE_TCP_PORT=${MESHCORE_PROXY_PORT:-5050}
      - DJANGO_API_URL=${CENTRAL_URL:-https://assista-crise.fr}/api
      - DJANGO_BRIDGE_EMAIL=${SATELLITE_EMAIL}
      - DJANGO_BRIDGE_PASSWORD=${SATELLITE_PASSWORD}
      - COMPAGNON_ID=${MESHCORE_COMPAGNON_ID}
      # Bascule vers l'assista-crise local si le central passe hors-ligne (voir
      # DjangoClient._cible_actuelle, meshcore-bridge/bridge.py) — LOCAL_API_URL vide par
      # défaut : le pont se débrouille tout seul (resoudre_url_locale : localhost:8000 si
      # même machine, sinon mDNS si un Pi Full séparé l'annonce sur le site, voir le service
      # annoncer-backend-local plus bas) — ne remplir LOCAL_API_URL à la main que pour forcer
      # une IP précise (réseau qui bloque mDNS, ou préférence explicite). Réutilise le
      # superuser local déjà provisionné (DJANGO_SUPERUSER_EMAIL/PASSWORD, service `backend`
      # ci-dessous) comme identifiants du pont sur le backend local.
      - LOCAL_API_URL=${LOCAL_API_URL:-}
      - LOCAL_BRIDGE_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - LOCAL_BRIDGE_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - etat_satellite:/var/run/satellite:ro
    depends_on:
      - meshcore-proxy
    restart: unless-stopped
    profiles: ["gw", "full"]

  # Optionnel — activer seulement si un CompagnonMeshtastic en TCP/SERIE existe côté Django
  # pour ce satellite (voir le commentaire en tête de fichier). MQTT (Gaulix) ne nécessite
  # aucun accès matériel local et fonctionnerait identiquement sans ce service dédié, mais
  # regrouper tous les CompagnonMeshtastic actifs (quel que soit leur mode) dans UN seul
  # pont reste le fonctionnement normal de meshtastic-bridge — voir son README.
  meshtastic-bridge:
    build:
      context: ../meshtastic-bridge
    network_mode: host
    environment:
      - DJANGO_API_URL=${CENTRAL_URL:-https://assista-crise.fr}/api
      - DJANGO_BRIDGE_EMAIL=${SATELLITE_EMAIL}
      - DJANGO_BRIDGE_PASSWORD=${SATELLITE_PASSWORD}
      # Bascule vers l'assista-crise local si le central passe hors-ligne — même mécanisme que
      # meshcore-bridge ci-dessus, voir son commentaire (détection automatique localhost/mDNS,
      # LOCAL_API_URL à ne remplir que pour forcer une IP précise).
      - LOCAL_API_URL=${LOCAL_API_URL:-}
      - LOCAL_BRIDGE_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - LOCAL_BRIDGE_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    devices:
      - "${MESHTASTIC_SERIE_DEVICE:-/dev/ttyACM0}:${MESHTASTIC_SERIE_DEVICE:-/dev/ttyACM0}"
    volumes:
      - etat_satellite:/var/run/satellite:ro
    restart: unless-stopped
    profiles: ["gw", "full"]

  etat-connectivite:
    build:
      context: .
      dockerfile: Dockerfile.etat
    # Source de vérité partagée pour tout composant qui doit savoir si le central est joignable
    # (bannière future, écran TFT futur) — voir satellite/etat_connectivite.py. Volume nommé
    # plutôt qu'un bind mount : un futur composant qui en a besoin monte le même volume, pas
    # besoin qu'il tourne sur l'hôte directement.
    environment:
      - CENTRAL_URL=${CENTRAL_URL:-https://assista-crise.fr}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - etat_satellite:/var/run/satellite
    restart: unless-stopped
    profiles: ["gw", "full"]

  # --- Profil "full" uniquement : instance assista-crise locale, utilisable sans internet ---

  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_DB=assista-db
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d assista-db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles: ["full"]

  mosquitto:
    image: eclipse-mosquitto
    volumes:
      - ./mosquitto-config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped
    profiles: ["full"]

  backend:
    build: ../backend
    # Publié sur TOUTES les interfaces (pas juste localhost) : un satellite GW SÉPARÉ sur le
    # même site (modèle à 2 Pi, voir le cadrage "Chantier B") doit pouvoir le joindre par le
    # LAN, pas seulement ce Pi lui-même en localhost — voir annoncer-backend-local ci-dessous
    # et resoudre_url_locale côté pont (meshcore-bridge/bridge.py). Sans lien avec la
    # résolution interne "backend" que frontend/mosquitto continuent d'utiliser normalement
    # (réseau Compose par défaut, inchangé).
    ports:
      - "8000:8000"
    volumes:
      - media_volume:/app/media
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - DB_HOST=db
      - DB_NAME=assista-db
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - MQTT_BROKER=mosquitto
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped
    profiles: ["full"]

  # Permet à un satellite GW SÉPARÉ sur le même site (modèle à 2 Pi) de trouver ce backend
  # local sans IP configurée à la main — voir satellite/annoncer_backend_local.py et
  # resoudre_url_locale côté pont. --network host pour la même raison que meshcore-proxy plus
  # haut : une annonce mDNS depuis un réseau Docker isolé porterait une IP interne, pas
  # joignable depuis le vrai LAN.
  annoncer-backend-local:
    build:
      context: .
      dockerfile: Dockerfile.annonce
    network_mode: host
    environment:
      - SATELLITE_NOM=${SATELLITE_NOM:-satellite-assista-crise}
      - BACKEND_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    profiles: ["full"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - backend
    restart: unless-stopped
    profiles: ["full"]

  # Conteneur "one-shot" : télécharge le fond de carte puis s'arrête (pas de restart policy) —
  # à relancer manuellement (`docker compose run --rm telecharger-tuiles`) pour régénérer les
  # tuiles (changement de département, mise à jour du fond de carte). Voir
  # telecharger_tuiles.py — département + limitrophes, pas juste la commune.
  telecharger-tuiles:
    build:
      context: .
      dockerfile: Dockerfile.tuiles
    command: ["${SATELLITE_DEPARTEMENT}", "--sortie", "/data/tuiles.pmtiles"]
    environment:
      - PMTILES_SOURCE=${PMTILES_SOURCE}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - tuiles_data:/data
    profiles: ["full"]

  tileserver:
    image: maptiler/tileserver-gl
    volumes:
      - tuiles_data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    profiles: ["full"]

volumes:
  etat_satellite:
  postgres_data:
  mosquitto_data:
  media_volume:
  tuiles_data:
