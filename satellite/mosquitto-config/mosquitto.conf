# Broker MQTT local du satellite (profil full) : réseau Docker interne uniquement, aucun port
# publié -- seuls les conteneurs du satellite le joignent. Même réglage que mosquitto/config/
# du dépôt (fichier absent jusqu'ici : Docker créait un dossier vide et le conteneur
# redémarrait en boucle, constaté le 20/10/2026).
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
allow_anonymous true
