# Broker MQTT local du satellite (profil full, conteneur mosquitto).
#
# Depuis le 06/11/2026, il n'est plus réservé au réseau Docker : des nœuds Meshtastic du site
# peuvent s'y connecter en passerelle MQTT. Deux conséquences, toutes deux obligatoires.
#
#   1. AUTHENTIFICATION et liste de droits (comme sur .114, voir mosquitto/config/acl.114).
#      L'ancienne configuration était `allow_anonymous true` : acceptable tant que le broker
#      n'était joignable que depuis les conteneurs du satellite, inacceptable dès qu'un port est
#      publié sur le réseau local.
#
#   2. Le port est publié par Compose sur la SEULE IP du LAN du satellite (SATELLITE_LAN_IP,
#      détectée par installer.sh), JAMAIS sur 0.0.0.0 : Docker contourne le pare-feu de la
#      machine, et un Raspberry Pi posé chez une mairie peut très bien se trouver derrière une
#      box qui redirige des ports. Pas de listener TLS, pas de redirection : le broker reste
#      strictement local au site.
#
# Ce broker n'est JAMAIS relié à celui du central (décision du 06/11/2026). Les échanges entre un
# satellite et le central passent par la synchronisation Django (sync-sortant / sync-entrant),
# qui est faite pour les coupures longues ; un pont MQTT demanderait d'exposer le broker du
# central sur Internet et n'éviterait aucun travail, puisque tout ce qui arrive doit de toute
# façon être écrit dans les modèles Django pour être exploitable.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

allow_anonymous false
password_file /tmp/passwd
acl_file /mosquitto/config/acl

# Un paquet Meshtastic fait moins de 512 octets : au-delà de 16 Ko, le message est anormal.
max_packet_size 16384
# Pas de file d'attente pour un client déconnecté : une passerelle radio qui revient ne doit pas
# recevoir une rafale de retard, qu'elle réémettrait sur la radio.
max_queued_messages 200

listener 1883
protocol mqtt
