# Application web du satellite (profil full) : l'interface Assista-Crise complète, servie sans
# internet aux téléphones et PC du réseau local -- http://<IP du satellite>:<WEB_PORT>/
# Remplace la configuration de l'image frontend (montée par satellite/docker-compose.yml).

server {
    listen 80;

    # Réseaux privés uniquement (RFC 1918) + la machine elle-même : jamais exposé à internet,
    # même si le satellite se retrouve derrière une box qui redirige ses ports.
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.0/8;
    deny all;

    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;

    # Dit au frontend qu'il tourne sur un satellite : fond de carte local (voir carte-style.ts)
    location = /config-instance.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        return 200 '{"satellite": true, "tuiles": "/tuiles/tuiles.pmtiles", "assetsCarte": "/tuiles/assets"}';
    }

    # Fond de carte hors ligne (telecharger-tuiles) : PMTiles lu par plages d'octets
    location /tuiles/ {
        alias /srv/tuiles/;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~ ^/(api|media|o|accounts|django-admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
