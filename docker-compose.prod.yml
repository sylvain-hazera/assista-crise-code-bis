services:
  frontend:
    image: im2ag-harbor.univ-grenoble-alpes.fr/assista-crise/frontend:latest
    container_name: ac_frontend
    restart: always
    networks:
      - front

  backend:
    image: im2ag-harbor.univ-grenoble-alpes.fr/assista-crise/backend:latest
    container_name: ac_backend
    volumes:
      - media_volume:/app/media
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - DB_HOST=db
      - DB_NAME=assista-db
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - MQTT_BROKER=mosquitto
      - EMAIL_HOST=smtp.ionos.fr      # Use Ionos in prod
      - EMAIL_PORT=465
      - EMAIL_USE_TLS=False
      - EMAIL_USE_SSL=True
      - DEFAULT_FROM_EMAIL=no-reply@assista-crise.fr
      - EMAIL_HOST_USER=no-reply@assista-crise.fr
      - EMAIL_HOST_PASSWORD=${EMAIL_PASSWORD}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
    # For Hardware USB Access (uncomment on VM/Host with antenna)
    # devices:
    #   - "/dev/ttyACM0:/dev/ttyACM0"
    restart: always
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - front
      - back

  # NB : ce fichier n'est plus la source de vérité du déploiement réel (.113/.114 sont
  # relancés à la main, voir les scripts de déploiement) — laissé ici pour une éventuelle
  # reconstruction from scratch. ATTENTION si ce cas se présente : POSTGRES_USER ci-dessous
  # devient le SUPERUSER PostgreSQL de bootstrap (comportement de l'image officielle), pas
  # juste "le compte de l'appli" — sur une base neuve, DB_USER/DB_PASS ne doivent PAS être les
  # identifiants applicatifs à droits restreints. Une fois la base initialisée, refaire la même
  # séparation superuser (bootstrap) / rôle applicatif à droits limités que sur .113/.114
  # (rôles svc_dbmaint / assista_app).
  db:
    image: postgis/postgis:15-3.3
    container_name: ac_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=assista-db
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d assista-db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - back

  mosquitto:
    image: eclipse-mosquitto
    container_name: ac_mqtt
    ports:
      - "1883:1883" # TCP listener
      - "9001:9001" # Websocket listener
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    networks:
      - front

  grafana:
    image: grafana/grafana
    container_name: ac_stats
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - back

  tileserver:
    image: maptiler/tileserver-gl
    container_name: ac_maps
    ports:
      - "8080:8080"
    # volumes:
    #   - ./tileserver:/data
    networks:
      - front

  proxy:
    image: im2ag-harbor.univ-grenoble-alpes.fr/assista-crise/proxy:latest
    container_name: ac_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
    depends_on:
      - frontend
      - backend
      - tileserver
    networks:
      - front

networks:
  front:
  back:

volumes:
  postgres_data:
  media_volume: