# Couche PRODUCTION, toujours avec la base :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile monitoring up -d
#
# Ce fichier n'est pas la source de vérité du déploiement réel (.114, relancé à la main derrière
# le WAF ac_waf) : il sert à une reconstruction from scratch et doit rester cohérent avec lui.
# Sur une base neuve, POSTGRES_USER devient le SUPERUSER PostgreSQL : DB_USER/DB_PASS ne doivent
# PAS être les identifiants applicatifs restreints ; refaire ensuite la séparation de .114
# (rôles svc_dbmaint / assista_app). Voir DOCUMENTATION.md, « Production ».

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- application
  frontend:
    image: im2ag-harbor.univ-grenoble-alpes.fr/assista-crise/frontend:${IMAGE_TAG:-latest}
    restart: always
    networks: [front]

  backend:
    image: im2ag-harbor.univ-grenoble-alpes.fr/assista-crise/backend:${IMAGE_TAG:-latest}
    environment:
      - DEBUG=False
      - EMAIL_HOST=smtp.ionos.fr
      - EMAIL_PORT=465
      - EMAIL_USE_TLS=False
      - EMAIL_USE_SSL=True
      - DEFAULT_FROM_EMAIL=no-reply@assista-crise.fr
      - EMAIL_HOST_USER=no-reply@assista-crise.fr
      - EMAIL_HOST_PASSWORD=${EMAIL_PASSWORD}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
    restart: always
    networks: [front, back, db]

  db:
    restart: always
    networks: [db]                 # réseau isolé : seuls backend et postgres-exporter le rejoignent

  mosquitto:
    ports:
      - "1883:1883"
      - "9001:9001"
    networks: [front]

  tileserver:
    networks: [front]              # aucun port publié : rien ne l'utilise depuis l'extérieur

  proxy:
    image: im2ag-harbor.univ-grenoble-alpes.fr/assista-crise/proxy:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
    networks: [front]

  # ---------------------------------------------------------------- monitoring
  prometheus:
    <<: *restart
    image: stefy237/assista-crise-prometheus:${IMAGE_TAG:-latest}
    environment:
      - ENVIRONMENT=prod
    command:                       # surcharger command remplace TOUS les arguments par défaut
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks: [monitoring, front]  # front : scrape de backend:8000/metrics

  alertmanager:
    <<: *restart
    image: stefy237/assista-crise-alertmanager:${IMAGE_TAG:-latest}
    command: ['--config.file=/etc/alertmanager/alertmanager.prod.yml', '--storage.path=/alertmanager']
    secrets: [email_password, healthchecks_url]
    networks: [monitoring]

  grafana:
    <<: *restart
    image: stefy237/assista-crise-grafana:${IMAGE_TAG:-latest}
    ports: ["127.0.0.1:3000:3000"] # accès : ssh -L 3000:localhost:3000 <vm>
    networks: [monitoring]

  postgres-exporter:
    <<: *restart
    networks: [monitoring, db]

  nginx-exporter:
    <<: *restart
    networks: [monitoring, front]

  mosquitto-exporter:
    <<: *restart
    networks: [monitoring, front]

  cadvisor:          { <<: *restart, networks: [monitoring] }
  node-exporter:     { <<: *restart, networks: [monitoring] }
  blackbox-exporter: { <<: *restart, networks: [monitoring] }

secrets:
  email_password:   { file: "${SECRETS_DIR:-./secrets}/email_password.txt" }
  healthchecks_url: { file: "${SECRETS_DIR:-./secrets}/healthchecks_url.txt" }

networks:
  front:
  back:
  db:
  monitoring:
