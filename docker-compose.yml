services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ac_frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app         
      - /app/node_modules       
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - reseau_public

  tileserver:
    image: maptiler/tileserver-gl
    container_name: ac_maps
    ports:
      - "8080:8080"
    networks:
      - reseau_public

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: assista_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001" 
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - reseau_public 
      - reseau_prive 

  proxy:
    build: ./proxy
    container_name: ac_proxy
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
      - tileserver
    networks:
      - reseau_public
      - reseau_prive

  backend:
    build: ./backend
    container_name: ac_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    environment:
      - DB_HOST=db
      - DB_NAME=assista-db
      - DB_USER=admin
      - DB_PASS=admin
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=backend_user
      - MQTT_PASSWORD=admin
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
      mailhog:
        condition: service_started
    networks:
      - reseau_prive

  db:
    image: postgis/postgis:15-3.3
    container_name: ac_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=assista-db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    ports:
      - "5432:5432"    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d assista-db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reseau_prive

  grafana:
    image: grafana/grafana
    container_name: ac_stats
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - reseau_prive

  mailhog:
    image: mailhog/mailhog
    container_name: ac_mailer
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    networks:
      - default
    environment:
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025

  tileserver:
    image: maptiler/tileserver-gl
    container_name: ac_maps
    ports:
      - "8080:8080"
    # volumes:
    #   - ./tileserver:/data

  proxy:
    build: ./proxy
    container_name: ac_proxy
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
      - tileserver
      - "1025:1025"
      - "8025:8025"
    networks:
      - reseau_prive

volumes:
  postgres_data:
  media_volume:

networks:
  reseau_public:
    driver: bridge
  reseau_prive:
    driver: bridge